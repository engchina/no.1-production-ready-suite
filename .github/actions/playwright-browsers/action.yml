name: Install Playwright browsers
description: >-
  Playwright の chromium（headless shell）を ~/.cache/ms-playwright にキャッシュする。key は Playwright の版。
  hit したら OS の依存（install-deps）だけを入れる（#339）。保存は main だけで、PR は復元だけにする（#1589）。

inputs:
  working-directory:
    description: "@playwright/test を npm ci 済みの frontend のディレクトリ（例: rag/frontend）"
    required: true

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Restore Playwright browsers
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}-chromium-shell

    # headless の実行は chromium-headless-shell だけを使う（headed / channel 指定の spec は無い）。
    - name: Install browsers and OS dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx --no-install playwright install --with-deps --only-shell chromium

    # PR（Playwright の版を上げる Dependabot 等）が保存すると、cache が PR の範囲に残って main の cache を追い出す
    # （PR の範囲の Playwright の cache が約 540 MB あった。#1589）。PR は main の cache が無ければ取得し直す。
    - name: Save Playwright browsers
      if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}-chromium-shell

    - name: Install OS dependencies
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx --no-install playwright install-deps chromium
