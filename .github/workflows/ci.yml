name: CI

# monorepo（platform / rag / nl2sql / agent）の統合 CI（#71）。
# changes job で変更パスを判定し、変更のあった製品の job だけを実行する。
# platform/ と本 workflow の変更は全製品に影響するため、全 job を実行する。
# branch protection の必須 check は最後の `CI OK` だけにする（skip された job を必須にすると pending のまま止まるため）。

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      platform: ${{ steps.filter.outputs.platform }}
      rag: ${{ steps.filter.outputs.rag }}
      nl2sql: ${{ steps.filter.outputs.nl2sql }}
      agent: ${{ steps.filter.outputs.agent }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            platform:
              - "platform/**"
              - ".github/workflows/ci.yml"
            rag:
              - "rag/**"
            nl2sql:
              - "nl2sql/**"
            agent:
              - "agent/**"
            terraform:
              - "terraform/**"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # full history を走査して過去コミットの混入も検出する
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # gitleaks-action は PR スキャンに GITHUB_TOKEN を要求する(未指定だと失敗する)。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # pre-commit hook と同一の設定/ルールで走査する（monorepo root の設定）
          GITLEAKS_CONFIG: .gitleaks.toml
          # OSS リポジトリ向けライセンスは不要(private の場合のみ要設定)
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # ---------------------------------------------------------------- platform

  platform-ui:
    name: Platform / UI (@engchina/production-ready-ui)
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (dist/index.js + d.ts + tokens.css)
        run: npm run build

      # dist が公開契約どおり生成されたことを確認する。
      - name: Verify dist artifacts
        run: |
          test -f packages/ui/dist/index.js
          test -f packages/ui/dist/index.d.ts
          test -f packages/ui/dist/tokens.css
          test -f packages/ui/dist/tokens/colors.css

  platform-backend-core:
    name: Platform / backend_core (production-ready-backend-core)
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/packages/backend_core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: platform/packages/backend_core/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Format check
        run: uv run black --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest --cov=pr_backend_core

      - name: Security scan
        run: uv run bandit -r src

      - name: Dependency audit
        run: uv run pip-audit

  platform-system-settings-backend:
    name: Platform / system_settings_backend (pr_system_settings)
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/packages/system_settings_backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: platform/packages/system_settings_backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Format check
        run: uv run black --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest --cov=pr_system_settings

      - name: Security scan
        run: uv run bandit -r src

      - name: Dependency audit
        run: uv run pip-audit

  # ---------------------------------------------------------------- rag

  rag-backend:
    name: RAG / Backend
    needs: changes
    if: needs.changes.outputs.rag == 'true' || needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag/backend
    steps:
      # backend は共有 production-ready-backend-core（../../platform/packages/backend_core）に path 依存する。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: rag/backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Format check
        run: uv run black --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy .

      # coverage threshold を gate にしていないため CI では計測しない(nl2sql と同一構成)。
      - name: Test
        run: uv run pytest

      - name: Security scan
        run: uv run bandit -c pyproject.toml -r app

      - name: Dependency audit
        # oci 2.185.1 が cryptography<51.0.0 へ制約を緩和したため cryptography 50 系へ更新でき、
        # GHSA-537c-gmf6-5ccf の ignore は不要になった。ignore を戻す場合は理由をここへ明記する。
        run: uv run pip-audit

  rag-docrag-core:
    name: RAG / DocRAG core
    needs: changes
    if: needs.changes.outputs.rag == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag/packages/docrag_core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # rag_poc(DocRAG)由来の解析・分割・回答・FAQ/ドメインキーワードの回帰テスト。
      # docling/torch は入れず、PDF 描画・日本語分割・Excel の任意依存だけを入れる。
      - name: Test docrag_core
        run: |
          uv venv -p 3.12 .venv
          uv pip install -p .venv/bin/python -e ".[pdf,japanese,excel,oracle]" pytest
          .venv/bin/python -m pytest -q tests

  rag-frontend:
    name: RAG / Frontend
    needs: changes
    if: needs.changes.outputs.rag == 'true' || needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag/frontend
    steps:
      # frontend は file:../../platform/packages/ui に依存するため、先に共有 UI を build する。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            rag/frontend/package-lock.json
            platform/package-lock.json

      - name: Build shared UI package
        working-directory: platform
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      # 型検査は build の `tsc --noEmit` が兼ねる。Playwright E2E は rag-e2e job（#133）。
      # lint / audit はローカル検証と PR review で確認する。
      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build

  rag-e2e:
    name: RAG / E2E smoke
    needs: changes
    if: needs.changes.outputs.rag == 'true' || needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rag/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            rag/frontend/package-lock.json
            platform/package-lock.json

      - name: Build shared UI package
        working-directory: platform
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # PR では約 1 分の smoke だけを実行する（#184。ユーザー指示：1 回の e2e はおおむね 1 分）。
      # 全件は e2e-nightly.yml が毎晩実行する。desktop / mobile の 2 project、CI=true で retries 2。
      - name: Playwright E2E (smoke)
        run: >-
          npx playwright test --workers=1
          e2e/card-error-boundary.spec.ts e2e/db-down-degraded.spec.ts e2e/self-hosted-fonts.spec.ts
          e2e/sidebar-grouping.spec.ts e2e/db-gate.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rag-playwright-smoke
          path: rag/frontend/test-results
          retention-days: 7

  rag-compose:
    name: RAG / Docker Compose
    needs: changes
    if: needs.changes.outputs.rag == 'true' || needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate compose config
        run: docker compose config --quiet

  # OCI Resource Manager の統合 stack（terraform/）が cloud-init から呼ぶ RAG の init_script.sh を検証する（#217）。
  rag-init-script:
    name: RAG / Compute init script
    needs: changes
    if: needs.changes.outputs.rag == 'true' || needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # docker compose で生成した override も検証する（ubuntu-latest には docker compose がある）。
      - name: Test Compute init script
        run: |
          bash -n init_script.sh scripts/tests/init-script-deployment.test.sh
          bash scripts/tests/init-script-deployment.test.sh

  # ---------------------------------------------------------------- nl2sql

  nl2sql-deploy-scripts:
    name: NL2SQL / Deployment scripts
    needs: changes
    if: needs.changes.outputs.nl2sql == 'true' || needs.changes.outputs.rag == 'true' || needs.changes.outputs.agent == 'true' || needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nl2sql
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test deployment update and recovery scripts
        run: |
          bash -n init_script.sh scripts/git-pull.sh scripts/update-after-pull.sh scripts/tail-logs.sh scripts/start-frontend.sh ../rag/scripts/start-frontend.sh ../agent/scripts/start-frontend.sh
          bash scripts/tests/git-pull.test.sh
          bash scripts/tests/init-script-deployment.test.sh
          bash scripts/tests/update-after-pull.test.sh
          bash scripts/tests/tail-logs.test.sh
          bash scripts/tests/start-frontend.test.sh
          bash scripts/tests/start-frontend.test.sh ../rag/scripts/start-frontend.sh
          bash scripts/tests/start-frontend.test.sh ../agent/scripts/start-frontend.sh

  nl2sql-frontend:
    name: NL2SQL / Frontend
    needs: changes
    if: needs.changes.outputs.nl2sql == 'true' || needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nl2sql/frontend
    steps:
      # frontend は file:../../platform/packages/ui に依存するため、先に共有 UI を build する。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            nl2sql/frontend/package-lock.json
            platform/package-lock.json

      - name: Build shared UI package
        working-directory: platform
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      # デザインシステム遵守ルール（frontend/.oxlintrc.json が ../../platform の
      # docs/design-system/adherence.oxlintrc.json を extends）と oxlint 既定の correctness ルール。
      - name: Lint
        run: npm run lint

      - name: Logic tests
        run: npm run test:logic

      - name: Build
        run: npm run build

  nl2sql-e2e:
    name: NL2SQL / E2E smoke
    needs: changes
    if: needs.changes.outputs.nl2sql == 'true' || needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nl2sql/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            nl2sql/frontend/package-lock.json
            platform/package-lock.json

      - name: Build shared UI package
        working-directory: platform
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # PR では約 1 分の smoke だけを実行する（#184。ユーザー指示：1 回の e2e はおおむね 1 分）。
      # 全件は e2e-nightly.yml が毎晩 8 shard で実行する。CI=true で retries 2、負荷対策で 1 worker（#175）。
      - name: Playwright E2E (smoke)
        run: |
          npx playwright test --workers=1 tests/e2e/header-utilities.spec.ts
          npx playwright test --workers=1 --project=desktop tests/e2e/database-gate.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nl2sql-playwright-smoke
          path: nl2sql/frontend/test-results
          retention-days: 7

  nl2sql-backend:
    name: NL2SQL / Backend
    needs: changes
    if: needs.changes.outputs.nl2sql == 'true' || needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    env:
      NL2SQL_RUNTIME_MODE: memory
      NL2SQL_FEEDBACK_EMBEDDING_ENABLED: "false"
    defaults:
      run:
        working-directory: nl2sql/backend
    steps:
      # backend は共有 production-ready-backend-core（../../platform/packages/backend_core）に path 依存する。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: nl2sql/backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Format check
        run: uv run black --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy .

      - name: Test
        run: uv run pytest

      - name: Security scan
        run: uv run bandit -r app

      - name: Dependency audit
        # OCI SDK currently constrains cryptography to <47.0.0, while GHSA-537c-gmf6-5ccf
        # lists 48.0.1 as the first fixed version. Keep auditing all other findings.
        run: uv run pip-audit --ignore-vuln GHSA-537c-gmf6-5ccf

  # ---------------------------------------------------------------- agent

  agent-checks:
    name: Agent / Full Checks
    needs: changes
    if: needs.changes.outputs.agent == 'true' || needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      # backend / frontend は ../../platform の共有パッケージに path 依存する。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            agent/frontend/package-lock.json
            platform/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: agent/backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build shared UI package
        working-directory: platform
        run: |
          npm ci
          npm run build

      - name: Install frontend dependencies
        working-directory: agent/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: agent/frontend
        run: npx playwright install --with-deps chromium

      - name: Run standard checks
        run: scripts/check-all.sh
        env:
          UV_SYNC_ARGS: "--locked --dev"

  # OCI Resource Manager の統合 stack（terraform/）が cloud-init から呼ぶ Agent の init_script.sh を検証する（#217）。
  agent-init-script:
    name: Agent / Compute init script
    needs: changes
    if: needs.changes.outputs.agent == 'true' || needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test Compute init script
        run: |
          bash -n init_script.sh scripts/tests/init-script-deployment.test.sh
          bash scripts/tests/init-script-deployment.test.sh

  # ---------------------------------------------------------------- terraform

  # OCI Resource Manager の統合 stack（#217）。ADB 1つ＋選んだ製品ごとの Compute。
  # 契約検証は各製品の init_script.sh・Settings・docker-compose.yml も読むため、どの製品の変更でも実行する。
  # 実テナンシーへの配備確認は手動で行う。
  suite-terraform:
    name: Suite / Terraform
    needs: changes
    if: >-
      needs.changes.outputs.terraform == 'true' || needs.changes.outputs.platform == 'true'
      || needs.changes.outputs.rag == 'true' || needs.changes.outputs.nl2sql == 'true' || needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.5.7"

      - name: Check shell scripts
        run: bash -n stack/extract_wallet.sh

      - name: Format check
        run: terraform fmt -check -recursive stack

      - name: Initialize Terraform
        working-directory: terraform/stack
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: terraform/stack
        run: terraform validate

      - name: Package stack
        run: python scripts/package_stack.py --output /tmp/production-ready-suite-terraform-stack.zip

      - name: Verify stack contract
        run: python scripts/verify_stack_contract.py /tmp/production-ready-suite-terraform-stack.zip

  # ---------------------------------------------------------------- 集約

  ci-ok:
    name: CI OK
    if: always()
    needs:
      - changes
      - secret-scan
      - platform-ui
      - platform-backend-core
      - platform-system-settings-backend
      - rag-backend
      - rag-docrag-core
      - rag-frontend
      - rag-e2e
      - rag-compose
      - rag-init-script
      - nl2sql-deploy-scripts
      - nl2sql-frontend
      - nl2sql-e2e
      - nl2sql-backend
      - agent-checks
      - agent-init-script
      - suite-terraform
    runs-on: ubuntu-latest
    steps:
      # skip（変更のない製品）は成功扱い。failure / cancelled が1つでもあれば失敗させる。
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "job results: ${RESULTS}"
          if echo "${RESULTS}" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::失敗または中断された job があります。"
            exit 1
          fi
