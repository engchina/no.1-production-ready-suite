name: CI

# monorepo（platform / rag / nl2sql / agent）の統合 CI（#71）。
# changes job で変更パスを判定し、変更のあった製品の job だけを実行する。
# platform/ は frontend（共有 UI・システム設定画面・デザインシステム）と backend（backend_core・system_settings_backend）に
# 分けて判定し、製品の frontend / backend の job はそれぞれの側の変更だけで動く（#339）。
# 本 workflow・.github/actions/ と、どちらにも属さない platform のファイル（.env.example・contracts/ 等）の変更は両方に効く。
# platform の Markdown（AGENTS.md・README・docs/ux-contracts 等）だけの変更では製品の job を動かさない
# （docs/design-system/ は lint 設定を含むため frontend に数える）。
# branch protection の必須 check は最後の `CI OK` だけにする（skip された job を必須にすると pending のまま止まるため）。
# main の push で失敗したら ci-failure-issue.yml が Issue を作る（ruleset の strict をやめたため。#339）。

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rag: ${{ steps.filter.outputs.rag }}
      nl2sql: ${{ steps.filter.outputs.nl2sql }}
      agent: ${{ steps.filter.outputs.agent }}
      terraform: ${{ steps.filter.outputs.terraform }}
      platform_frontend: >-
        ${{ steps.filter.outputs.platform_frontend == 'true' || steps.filter.outputs.ci == 'true'
        || steps.filter.outputs.platform_other == 'true' }}
      platform_backend: >-
        ${{ steps.filter.outputs.platform_backend == 'true' || steps.filter.outputs.ci == 'true'
        || steps.filter.outputs.platform_other == 'true' }}
      # platform のどこか（Markdown だけの変更を除く）。配備スクリプト・Terraform の検証が使う。
      platform: >-
        ${{ steps.filter.outputs.platform_frontend == 'true' || steps.filter.outputs.platform_backend == 'true'
        || steps.filter.outputs.ci == 'true' || steps.filter.outputs.platform_other == 'true' }}
      nl2sql_frontend_contract: ${{ steps.filter.outputs.nl2sql_frontend_contract }}
      # pip-audit は依存（uv.lock / pyproject.toml）が変わったときだけ実行する。全件は dependency-audit-nightly.yml。
      # `--skip-editable`: 自分たちの package（editable で入る backend と platform の package）は PyPI に無いので問い合わせない。
      # PyPI が存在しない名前に 404 ではなく 503 を返し続け、pip-audit が失敗したため（#344）。
      platform_backend_core_deps: ${{ steps.filter.outputs.platform_backend_core_deps == 'true' || steps.filter.outputs.ci == 'true' }}
      platform_system_settings_deps: ${{ steps.filter.outputs.platform_system_settings_deps == 'true' || steps.filter.outputs.ci == 'true' }}
      rag_deps: ${{ steps.filter.outputs.rag_deps == 'true' || steps.filter.outputs.ci == 'true' }}
      nl2sql_deps: ${{ steps.filter.outputs.nl2sql_deps == 'true' || steps.filter.outputs.ci == 'true' }}
      agent_deps: ${{ steps.filter.outputs.agent_deps == 'true' || steps.filter.outputs.ci == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # `!` の除外は、その filter の中で含めたファイルから除く（除外の無い filter は従来の some と同じ。v4.0.3 以降）。
          predicate-quantifier: some-with-excludes
          filters: |
            ci:
              - ".github/workflows/ci.yml"
              - ".github/actions/**"
            platform_frontend:
              - "platform/packages/ui/**"
              - "platform/packages/system-settings/**"
              - "platform/docs/design-system/**"
              - "platform/package.json"
              - "platform/package-lock.json"
            platform_backend:
              - "platform/packages/backend_core/**"
              - "platform/packages/system_settings_backend/**"
            # NL2SQL / Frontend のロジックテスト（tests/*-contract.test.ts）が読む、共通設定 API の backend の定義。
            nl2sql_frontend_contract:
              - "platform/packages/system_settings_backend/src/pr_system_settings/model.py"
              - "platform/packages/system_settings_backend/src/pr_system_settings/database.py"
            rag:
              - "rag/**"
            nl2sql:
              - "nl2sql/**"
            agent:
              - "agent/**"
            terraform:
              - "terraform/**"
            platform_backend_core_deps:
              - "platform/packages/backend_core/uv.lock"
              - "platform/packages/backend_core/pyproject.toml"
            platform_system_settings_deps:
              - "platform/packages/system_settings_backend/uv.lock"
              - "platform/packages/system_settings_backend/pyproject.toml"
            rag_deps:
              - "rag/backend/uv.lock"
              - "rag/backend/pyproject.toml"
            nl2sql_deps:
              - "nl2sql/backend/uv.lock"
              - "nl2sql/backend/pyproject.toml"
            agent_deps:
              - "agent/backend/uv.lock"
              - "agent/backend/pyproject.toml"
            # frontend / backend のどちらにも属さない platform のファイル（.env.example・contracts/・scripts/・templates/ 等）。
            platform_other:
              - "platform/**"
              - "!platform/packages/ui/**"
              - "!platform/packages/system-settings/**"
              - "!platform/packages/backend_core/**"
              - "!platform/packages/system_settings_backend/**"
              - "!platform/docs/design-system/**"
              - "!platform/package.json"
              - "!platform/package-lock.json"
              - "!platform/**/*.md"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # full history を走査して過去コミットの混入も検出する
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # gitleaks-action は PR スキャンに GITHUB_TOKEN を要求する(未指定だと失敗する)。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # pre-commit hook と同一の設定/ルールで走査する（monorepo root の設定）
          GITLEAKS_CONFIG: .gitleaks.toml
          # OSS リポジトリ向けライセンスは不要(private の場合のみ要設定)
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # ---------------------------------------------------------------- platform
  #
  # キャッシュの方針（#339）:
  #   - uv の cache は main の push だけが保存し、PR は main の cache を復元するだけにする
  #     （PR ごとに約 120 MB の cache を保存すると、repo の上限 10 GB を超えて main の cache が追い出される）。
  #   - mypy の .mypy_cache は lock とブランチを key にし、無ければ main（同じ lock → 別の lock）から復元する。
  #   - 共有 UI の dist と Playwright のブラウザは .github/actions/ の composite action がキャッシュする。

  platform-ui:
    name: Platform / UI (@engchina/production-ready-ui)
    needs: changes
    if: needs.changes.outputs.platform_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # root の typecheck / test / build はそれぞれ ui を build し直す（ローカルの単発実行のため）。
      # CI では ui を 1 回だけ build し、system-settings の型検査・テストはその dist を使う。
      - name: Build UI (dist/index.js + d.ts + tokens.css)
        run: npm run build -w @engchina/production-ready-ui

      - name: Type check
        run: |
          npm run typecheck -w @engchina/production-ready-ui
          npm run typecheck -w @engchina/production-ready-system-settings

      - name: Unit tests
        run: |
          npm run test -w @engchina/production-ready-ui
          npm run test -w @engchina/production-ready-system-settings

      - name: Build system settings
        run: npm run build -w @engchina/production-ready-system-settings

      # dist が公開契約どおり生成されたことを確認する。
      - name: Verify dist artifacts
        run: |
          test -f packages/ui/dist/index.js
          test -f packages/ui/dist/index.d.ts
          test -f packages/ui/dist/tokens.css
          test -f packages/ui/dist/tokens/colors.css

  platform-backend-core:
    name: Platform / backend_core (production-ready-backend-core)
    needs: changes
    if: needs.changes.outputs.platform_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform/packages/backend_core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: platform/packages/backend_core/uv.lock
          save-cache: ${{ github.event_name == 'push' }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      # 整形の検査は ruff format（#345。black から置き換えた）。設定は pyproject.toml の [tool.ruff.format]。
      # ほかの backend の job も同じ。
      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Restore mypy cache
        uses: actions/cache@v6
        with:
          path: platform/packages/backend_core/.mypy_cache
          key: mypy-platform-backend-core-${{ hashFiles('platform/packages/backend_core/uv.lock') }}-${{ github.head_ref || github.ref_name }}
          restore-keys: |
            mypy-platform-backend-core-${{ hashFiles('platform/packages/backend_core/uv.lock') }}-
            mypy-platform-backend-core-

      - name: Type check
        run: uv run mypy src

      # -n auto: pytest-xdist で runner の CPU 数だけ並列に実行する（#344）。
      - name: Test
        run: uv run pytest -n auto --cov=pr_backend_core

      - name: Security scan
        run: uv run bandit -r src

      - name: Dependency audit
        if: needs.changes.outputs.platform_backend_core_deps == 'true'
        run: uv run pip-audit --skip-editable

  platform-system-settings-backend:
    name: Platform / system_settings_backend (pr_system_settings)
    needs: changes
    if: needs.changes.outputs.platform_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform/packages/system_settings_backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: platform/packages/system_settings_backend/uv.lock
          save-cache: ${{ github.event_name == 'push' }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Restore mypy cache
        uses: actions/cache@v6
        with:
          path: platform/packages/system_settings_backend/.mypy_cache
          key: mypy-platform-system-settings-${{ hashFiles('platform/packages/system_settings_backend/uv.lock') }}-${{ github.head_ref || github.ref_name }}
          restore-keys: |
            mypy-platform-system-settings-${{ hashFiles('platform/packages/system_settings_backend/uv.lock') }}-
            mypy-platform-system-settings-

      - name: Type check
        run: uv run mypy src

      # -n auto: pytest-xdist で runner の CPU 数だけ並列に実行する（#344）。
      - name: Test
        run: uv run pytest -n auto --cov=pr_system_settings

      - name: Security scan
        run: uv run bandit -r src

      - name: Dependency audit
        if: needs.changes.outputs.platform_system_settings_deps == 'true'
        run: uv run pip-audit --skip-editable

  # ---------------------------------------------------------------- rag

  rag-backend:
    name: RAG / Backend
    needs: changes
    if: needs.changes.outputs.rag == 'true' || needs.changes.outputs.platform_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rag/backend
    steps:
      # backend は共有 production-ready-backend-core（../../platform/packages/backend_core）に path 依存する。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: rag/backend/uv.lock
          save-cache: ${{ github.event_name == 'push' }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Restore mypy cache
        uses: actions/cache@v6
        with:
          path: rag/backend/.mypy_cache
          key: mypy-rag-backend-${{ hashFiles('rag/backend/uv.lock') }}-${{ github.head_ref || github.ref_name }}
          restore-keys: |
            mypy-rag-backend-${{ hashFiles('rag/backend/uv.lock') }}-
            mypy-rag-backend-

      - name: Type check
        run: uv run mypy .

      # coverage threshold を gate にしていないため CI では計測しない(nl2sql と同一構成)。
      # -n auto: pytest-xdist で並列に実行する。実 Oracle のテストは pyproject の
      # --dist loadgroup で 1 つの worker にまとまる（#344）。
      # --assert=plain: pytest の assert の書き換え（失敗したときに比べた値を出す仕組み）を止める。
      # CI にはテストの書き換え済みの .pyc が無く、worker ごとに全テスト（約 7 万行）を書き換えて、
      # それだけで Test の約 3 分の 1（約 10 秒）を占めていた（#401）。失敗したときだけ、失敗した
      # テストを書き換えありで流し直して詳細を出す（step の結果は失敗のまま）。
      - name: Test
        run: |
          uv run pytest -n auto --assert=plain && exit 0
          echo "失敗したテストを、assert の詳細付きで流し直します（--lf）。"
          uv run pytest --lf --lfnf=none --maxfail=20 || true
          exit 1

      - name: Security scan
        run: uv run bandit -c pyproject.toml -r app

      - name: Dependency audit
        if: needs.changes.outputs.rag_deps == 'true'
        # oci 2.185.1 が cryptography<51.0.0 へ制約を緩和したため cryptography 50 系へ更新でき、
        # GHSA-537c-gmf6-5ccf の ignore は不要になった。ignore を戻す場合は理由をここへ明記する。
        run: uv run pip-audit --skip-editable

  rag-engine:
    name: RAG / Engine
    needs: changes
    if: needs.changes.outputs.rag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rag/packages/rag_engine
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # lock（#387）から入れる。PyPI の索引（/simple/）が落ちても、lock の中のファイルの URL から取れる。
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: rag/packages/rag_engine/uv.lock
          cache-suffix: rag-engine
          save-cache: ${{ github.event_name == 'push' }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # rag_poc 由来の解析・分割・回答・FAQ/ドメインキーワードの回帰テスト。
      # docling/torch は入れず、PDF 描画・日本語分割・Excel の任意依存だけを入れる。
      - name: Test rag_engine
        run: |
          uv sync --locked --extra pdf --extra japanese --extra excel --extra oracle
          uv run --locked --no-sync python -m pytest -q tests

  services-scripts-lint:
    name: Lint / services & scripts
    needs: changes
    if: needs.changes.outputs.rag == 'true' || needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # 各 backend の job は自分のディレクトリだけを検査するため、RAG のマイクロサービス（rag/services）と
      # platform のスクリプト（platform/scripts）は、venv を作らずに ruff だけで検査する（#517）。
      # 設定は各サービスの pyproject.toml と platform/scripts/ruff.toml。版は rag/backend の uv.lock の ruff にそろえる。
      - name: Ruff
        run: |
          version="$(sed -n '/^name = "ruff"$/{n;s/^version = "\(.*\)"$/\1/p;}' rag/backend/uv.lock)"
          test -n "${version}"
          uvx "ruff@${version}" check rag/services platform/scripts
          uvx "ruff@${version}" format --check rag/services platform/scripts

      # e2e の影響分析の選択の規則（platform/scripts/e2e_impact.py。#885）。標準ライブラリだけで動く。
      - name: Unit tests (platform/scripts)
        run: python3 -m unittest discover -s platform/scripts/tests -p 'test_*.py'

  rag-frontend:
    name: RAG / Frontend
    needs: changes
    if: needs.changes.outputs.rag == 'true' || needs.changes.outputs.platform_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rag/frontend
    steps:
      # frontend は file:../../platform/packages/ui に依存するため、先に共有 UI を build する。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            rag/frontend/package-lock.json
            platform/package-lock.json

      - name: Build shared UI package
        uses: ./.github/actions/platform-ui

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 型検査は build の `tsc --noEmit` が兼ねる。Playwright E2E は rag-e2e job（#133）。
      # デザインシステム遵守ルール（../../platform/docs/design-system/adherence.oxlintrc.json を ESLint に渡す）。
      # NL2SQL / Agent と同じく CI で実行する（#1099。以前は lint を実行せず、main の失敗を検出できなかった）。
      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build

  rag-e2e:
    name: RAG / E2E smoke
    needs: changes
    if: needs.changes.outputs.rag == 'true' || needs.changes.outputs.platform_frontend == 'true'
    runs-on: ubuntu-latest
    # 実測は 1〜2 分（2026-09）。
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rag/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            rag/frontend/package-lock.json
            platform/package-lock.json

      - name: Build shared UI package
        uses: ./.github/actions/platform-ui

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-browsers
        with:
          working-directory: rag/frontend

      # PR では約 1 分の smoke と、差分に影響を受ける spec（e2e-impact。#885）を実行する（#184。ユーザー指示：1 回の e2e はおおむね 1 分）。
      # 全件は e2e-nightly.yml が毎晩実行する。desktop / mobile の 2 project、CI=true で retries 2。
      - name: Playwright E2E (smoke)
        run: >-
          npx playwright test --workers=1
          e2e/card-error-boundary.spec.ts e2e/db-down-degraded.spec.ts e2e/self-hosted-fonts.spec.ts
          e2e/sidebar-grouping.spec.ts e2e/db-gate.spec.ts e2e/scrollbar-stability.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rag-playwright-smoke
          path: rag/frontend/test-results
          retention-days: 7

  # OCI Resource Manager の統合 stack（terraform/）が cloud-init から呼ぶ RAG の init_script.sh を検証する（#217）。
  rag-init-script:
    name: RAG / Compute init script
    needs: changes
    if: needs.changes.outputs.rag == 'true' || needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rag
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ネイティブ配備（uv の venv + systemd + Nginx。#286）。systemctl 等は fake で、生成した sudoers は visudo で検査する。
      - name: Test Compute init script
        run: |
          bash -n init_script.sh scripts/rag-systemd.sh scripts/rag-services.sh scripts/tests/init-script-deployment.test.sh
          bash scripts/tests/init-script-deployment.test.sh

  # ---------------------------------------------------------------- nl2sql

  nl2sql-deploy-scripts:
    name: NL2SQL / Deployment scripts
    needs: changes
    if: needs.changes.outputs.nl2sql == 'true' || needs.changes.outputs.rag == 'true' || needs.changes.outputs.agent == 'true' || needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nl2sql
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test deployment update and recovery scripts
        run: |
          bash -n init_script.sh scripts/git-pull.sh scripts/update-after-pull.sh scripts/tail-logs.sh scripts/start-frontend.sh ../rag/scripts/start-frontend.sh ../agent/scripts/start-frontend.sh
          bash scripts/tests/git-pull.test.sh
          bash scripts/tests/init-script-deployment.test.sh
          bash scripts/tests/update-after-pull.test.sh
          bash scripts/tests/tail-logs.test.sh
          bash ../platform/scripts/tests/log-viewer.test.sh

      - name: Verify Nginx logging and login rate limit contracts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
          bash ../platform/scripts/tests/nginx-logging.test.sh
          bash ../platform/scripts/tests/nginx-login-limit.test.sh
          bash scripts/tests/start-frontend.test.sh
          bash scripts/tests/start-frontend.test.sh ../rag/scripts/start-frontend.sh
          bash scripts/tests/start-frontend.test.sh ../agent/scripts/start-frontend.sh

  nl2sql-frontend:
    name: NL2SQL / Frontend
    needs: changes
    if: >-
      needs.changes.outputs.nl2sql == 'true' || needs.changes.outputs.platform_frontend == 'true'
      || needs.changes.outputs.nl2sql_frontend_contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nl2sql/frontend
    steps:
      # frontend は file:../../platform/packages/ui に依存するため、先に共有 UI を build する。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            nl2sql/frontend/package-lock.json
            platform/package-lock.json

      - name: Build shared UI package
        uses: ./.github/actions/platform-ui

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # デザインシステム遵守ルール（frontend/.oxlintrc.json が ../../platform の
      # docs/design-system/adherence.oxlintrc.json を extends）と oxlint 既定の correctness ルール。
      - name: Lint
        run: npm run lint

      # `tsc -p tsconfig.test.json`（tsconfig.json を extends し、src と tests を含む）で型検査してから node --test を実行する。
      - name: Logic tests
        run: npm run test:logic

      # 型検査は Logic tests の tsc が src も含めて済ませているため、`npm run build`（tsc --noEmit && vite build）の
      # tsc を二重に実行せず、vite build だけを行う（#339）。
      - name: Build
        run: npx --no-install vite build

  nl2sql-e2e:
    name: NL2SQL / E2E smoke
    needs: changes
    if: needs.changes.outputs.nl2sql == 'true' || needs.changes.outputs.platform_frontend == 'true'
    runs-on: ubuntu-latest
    # 実測は 1.5〜2 分（2026-09）。
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nl2sql/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            nl2sql/frontend/package-lock.json
            platform/package-lock.json

      - name: Build shared UI package
        uses: ./.github/actions/platform-ui

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-browsers
        with:
          working-directory: nl2sql/frontend

      # PR では約 1 分の smoke と、差分に影響を受ける spec（e2e-impact。#885）を実行する（#184。ユーザー指示：1 回の e2e はおおむね 1 分）。
      # 全件は e2e-nightly.yml が毎晩 8 shard で実行する。CI=true で retries 2、負荷対策で 1 worker（#175）。
      - name: Playwright E2E (smoke)
        run: |
          npx playwright test --workers=1 tests/e2e/header-utilities.spec.ts tests/e2e/scrollbar-stability.spec.ts tests/e2e/sql-chat.spec.ts
          npx playwright test --workers=1 --project=desktop tests/e2e/database-gate.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nl2sql-playwright-smoke
          path: nl2sql/frontend/test-results
          retention-days: 7

  nl2sql-backend:
    name: NL2SQL / Backend
    needs: changes
    if: needs.changes.outputs.nl2sql == 'true' || needs.changes.outputs.platform_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NL2SQL_RUNTIME_MODE: memory
      NL2SQL_FEEDBACK_EMBEDDING_ENABLED: "false"
    defaults:
      run:
        working-directory: nl2sql/backend
    steps:
      # backend は共有 production-ready-backend-core（../../platform/packages/backend_core）に path 依存する。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: nl2sql/backend/uv.lock
          save-cache: ${{ github.event_name == 'push' }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Restore mypy cache
        uses: actions/cache@v6
        with:
          path: nl2sql/backend/.mypy_cache
          key: mypy-nl2sql-backend-${{ hashFiles('nl2sql/backend/uv.lock') }}-${{ github.head_ref || github.ref_name }}
          restore-keys: |
            mypy-nl2sql-backend-${{ hashFiles('nl2sql/backend/uv.lock') }}-
            mypy-nl2sql-backend-

      - name: Type check
        run: uv run mypy .

      # -n auto: pytest-xdist で runner の CPU 数だけ並列に実行する（#344）。
      - name: Test
        run: uv run pytest -n auto

      - name: Security scan
        run: uv run bandit -r app

      - name: Dependency audit
        if: needs.changes.outputs.nl2sql_deps == 'true'
        # OCI SDK currently constrains cryptography to <47.0.0, while GHSA-537c-gmf6-5ccf
        # lists 48.0.1 as the first fixed version. Keep auditing all other findings.
        # dependency-audit-nightly.yml にも同じ ignore を書く。
        run: uv run pip-audit --skip-editable --ignore-vuln GHSA-537c-gmf6-5ccf

  # ---------------------------------------------------------------- agent
  #
  # 旧 `Agent / Full Checks`（1 job で backend・frontend・Playwright 全件を直列に実行）を 3 job に分けた（#339）。
  # PR の e2e は RAG / NL2SQL と同じく約 1 分の smoke と差分に影響を受ける spec（#885）にし、全件は e2e-nightly.yml が実行する。

  agent-backend:
    name: Agent / Backend
    needs: changes
    if: needs.changes.outputs.agent == 'true' || needs.changes.outputs.platform_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      # backend は ../../platform の共有パッケージに path 依存する。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: agent/backend/uv.lock
          save-cache: ${{ github.event_name == 'push' }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore mypy cache
        uses: actions/cache@v6
        with:
          path: agent/backend/.mypy_cache
          key: mypy-agent-backend-${{ hashFiles('agent/backend/uv.lock') }}-${{ github.head_ref || github.ref_name }}
          restore-keys: |
            mypy-agent-backend-${{ hashFiles('agent/backend/uv.lock') }}-
            mypy-agent-backend-

      # ruff format / ruff check / mypy / pytest / 検証 evidence の dry-run / release chain の rehearsal / bandit / pip-audit。
      - name: Run backend checks
        run: scripts/check-all.sh
        env:
          SKIP_FRONTEND: "1"
          SKIP_AUDIT: ${{ needs.changes.outputs.agent_deps == 'true' && '0' || '1' }}
          UV_SYNC_ARGS: "--locked --dev"
          # pytest-xdist で runner の CPU 数だけ並列に実行する（#344）。
          PYTEST_ARGS: "-n auto"

  agent-frontend:
    name: Agent / Frontend
    needs: changes
    if: needs.changes.outputs.agent == 'true' || needs.changes.outputs.platform_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent/frontend
    steps:
      # frontend は file:../../platform/packages/ui に依存するため、先に共有 UI を build する。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            agent/frontend/package-lock.json
            platform/package-lock.json

      - name: Build shared UI package
        uses: ./.github/actions/platform-ui

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # 型検査は build の `tsc --noEmit` が兼ねる。
      - name: Build
        run: npm run build

  agent-e2e:
    name: Agent / E2E smoke
    needs: changes
    if: needs.changes.outputs.agent == 'true' || needs.changes.outputs.platform_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            agent/frontend/package-lock.json
            platform/package-lock.json

      - name: Build shared UI package
        uses: ./.github/actions/platform-ui

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-browsers
        with:
          working-directory: agent/frontend

      # PR では約 1 分の smoke と、差分に影響を受ける spec（e2e-impact。#885）を実行する（RAG / NL2SQL の #184 と同じ。#339）。
      # ログイン・認証・Run の stream・Runtime の主導線・セキュリティ管理・外観・フォント・設定の契約。
      # 全件（約 100 件）は e2e-nightly.yml が毎晩実行する。CI=true で retries 2、1 worker。
      - name: Playwright E2E (smoke)
        run: >-
          npx playwright test
          e2e/auth-login.spec.ts e2e/run-stream-auth.spec.ts e2e/agent-runtime-flow.spec.ts
          e2e/security-management.spec.ts e2e/appearance.spec.ts e2e/self-hosted-fonts.spec.ts
          e2e/permission-catalog.spec.ts e2e/vite-config.spec.ts e2e/scrollbar-stability.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: agent-playwright-smoke
          path: agent/frontend/test-results
          retention-days: 7

  # ---------------------------------------------------------------- e2e の影響分析（#885）
  #
  # PR の差分に影響を受ける Playwright の spec を選び、製品ごとに shard に分けて実行する。
  # nightly（e2e-nightly.yml）が全件の実行で記録した spec ごとの実行範囲（artifact `e2e-impact-<製品>-<shard>`）と
  # 差分の行を突き合わせる（platform/scripts/e2e_impact.py）。記録が無い・判定できない変更は全件にする。
  # 画面のコードを変えた PR で、その画面を検証する既存の spec が nightly で初めて壊れることを防ぐ。

  e2e-impact:
    name: E2E impact / 影響を受ける spec の選択
    needs: changes
    if: >-
      github.event_name == 'pull_request' && (needs.changes.outputs.rag == 'true'
      || needs.changes.outputs.nl2sql == 'true' || needs.changes.outputs.agent == 'true'
      || needs.changes.outputs.platform_frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      rag_mode: ${{ steps.select.outputs.rag_mode }}
      rag_specs: ${{ steps.select.outputs.rag_specs }}
      rag_shards: ${{ steps.select.outputs.rag_shards }}
      rag_total: ${{ steps.select.outputs.rag_total }}
      nl2sql_mode: ${{ steps.select.outputs.nl2sql_mode }}
      nl2sql_specs: ${{ steps.select.outputs.nl2sql_specs }}
      nl2sql_shards: ${{ steps.select.outputs.nl2sql_shards }}
      nl2sql_total: ${{ steps.select.outputs.nl2sql_total }}
      agent_mode: ${{ steps.select.outputs.agent_mode }}
      agent_specs: ${{ steps.select.outputs.agent_specs }}
      agent_shards: ${{ steps.select.outputs.agent_shards }}
      agent_total: ${{ steps.select.outputs.agent_total }}
    steps:
      # base との差分と、nightly の記録の commit（main の履歴）の両方を使うため全履歴を取る。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # spec が記録の fixture を通る `test` を使っていること（@playwright/test から直接 import しない）。
      - name: Check e2e imports
        run: python3 platform/scripts/e2e_impact.py check-imports

      - name: Select affected specs
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: origin/${{ github.base_ref }}
          RAG: ${{ needs.changes.outputs.rag == 'true' || needs.changes.outputs.platform_frontend == 'true' }}
          NL2SQL: ${{ needs.changes.outputs.nl2sql == 'true' || needs.changes.outputs.platform_frontend == 'true' }}
          AGENT: ${{ needs.changes.outputs.agent == 'true' || needs.changes.outputs.platform_frontend == 'true' }}
        run: |
          for product in rag nl2sql agent; do
            flag="$(echo "${product}" | tr '[:lower:]' '[:upper:]')"
            if [ "${!flag}" = "true" ]; then
              python3 platform/scripts/e2e_impact.py select --product "${product}" --base "${BASE}" --download
            else
              echo "${product}_mode=none" >> "${GITHUB_OUTPUT}"
              echo "${product}_shards=[]" >> "${GITHUB_OUTPUT}"
            fi
          done

  rag-e2e-impact:
    name: RAG / E2E impact (${{ matrix.shard }}/${{ needs.e2e-impact.outputs.rag_total }})
    needs: e2e-impact
    if: needs.e2e-impact.outputs.rag_mode == 'selected' || needs.e2e-impact.outputs.rag_mode == 'full'
    runs-on: ubuntu-latest
    # nightly の 1 shard の実測の倍程度（選ぶ shard 数は 1 shard 約 6 分を目安に決める）。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-impact.outputs.rag_shards) }}
    defaults:
      run:
        working-directory: rag/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            rag/frontend/package-lock.json
            platform/package-lock.json

      - name: Build shared UI package
        uses: ./.github/actions/platform-ui

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-browsers
        with:
          working-directory: rag/frontend

      # SPECS が空（全件）なら全 spec。spec のパスは空白区切りで渡す（単語分割を意図している）。
      - name: Playwright E2E (affected)
        env:
          SPECS: ${{ needs.e2e-impact.outputs.rag_specs }}
          SHARD: ${{ matrix.shard }}/${{ needs.e2e-impact.outputs.rag_total }}
        run: |
          # shellcheck disable=SC2086
          npx playwright test --workers=1 --pass-with-no-tests --shard="$SHARD" $SPECS

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rag-playwright-impact-${{ matrix.shard }}
          path: rag/frontend/test-results
          retention-days: 7

  nl2sql-e2e-impact:
    name: NL2SQL / E2E impact (${{ matrix.shard }}/${{ needs.e2e-impact.outputs.nl2sql_total }})
    needs: e2e-impact
    if: needs.e2e-impact.outputs.nl2sql_mode == 'selected' || needs.e2e-impact.outputs.nl2sql_mode == 'full'
    runs-on: ubuntu-latest
    # nightly の 1 shard の実測の倍程度（選ぶ shard 数は 1 shard 約 6 分を目安に決める）。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-impact.outputs.nl2sql_shards) }}
    defaults:
      run:
        working-directory: nl2sql/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            nl2sql/frontend/package-lock.json
            platform/package-lock.json

      - name: Build shared UI package
        uses: ./.github/actions/platform-ui

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-browsers
        with:
          working-directory: nl2sql/frontend

      # SPECS が空（全件）なら全 spec。spec のパスは空白区切りで渡す（単語分割を意図している）。
      - name: Playwright E2E (affected)
        env:
          SPECS: ${{ needs.e2e-impact.outputs.nl2sql_specs }}
          SHARD: ${{ matrix.shard }}/${{ needs.e2e-impact.outputs.nl2sql_total }}
        run: |
          # shellcheck disable=SC2086
          npx playwright test --workers=1 --pass-with-no-tests --shard="$SHARD" $SPECS

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nl2sql-playwright-impact-${{ matrix.shard }}
          path: nl2sql/frontend/test-results
          retention-days: 7

  agent-e2e-impact:
    name: Agent / E2E impact (${{ matrix.shard }}/${{ needs.e2e-impact.outputs.agent_total }})
    needs: e2e-impact
    if: needs.e2e-impact.outputs.agent_mode == 'selected' || needs.e2e-impact.outputs.agent_mode == 'full'
    runs-on: ubuntu-latest
    # nightly の 1 shard の実測の倍程度（選ぶ shard 数は 1 shard 約 6 分を目安に決める）。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-impact.outputs.agent_shards) }}
    defaults:
      run:
        working-directory: agent/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            agent/frontend/package-lock.json
            platform/package-lock.json

      - name: Build shared UI package
        uses: ./.github/actions/platform-ui

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-browsers
        with:
          working-directory: agent/frontend

      # SPECS が空（全件）なら全 spec。spec のパスは空白区切りで渡す（単語分割を意図している）。
      - name: Playwright E2E (affected)
        env:
          SPECS: ${{ needs.e2e-impact.outputs.agent_specs }}
          SHARD: ${{ matrix.shard }}/${{ needs.e2e-impact.outputs.agent_total }}
        run: |
          # shellcheck disable=SC2086
          npx playwright test --workers=1 --pass-with-no-tests --shard="$SHARD" $SPECS

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: agent-playwright-impact-${{ matrix.shard }}
          path: agent/frontend/test-results
          retention-days: 7

  # OCI Resource Manager の統合 stack（terraform/）が cloud-init から呼ぶ Agent の init_script.sh を検証する（#217）。
  agent-init-script:
    name: Agent / Compute init script
    needs: changes
    if: needs.changes.outputs.agent == 'true' || needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test Compute init script
        run: |
          bash -n init_script.sh scripts/tests/init-script-deployment.test.sh
          bash scripts/tests/init-script-deployment.test.sh

  # ---------------------------------------------------------------- terraform

  # OCI Resource Manager の統合 stack（#217）。ADB 1つ＋選んだ製品ごとの Compute。
  # 契約検証は各製品の init_script.sh・Settings と、自前の Dockerfile・compose が無いこと（Agent の第三者 Runtime の
  # compose だけ。#356）も確かめるため、どの製品の変更でも実行する。
  # 実テナンシーへの配備確認は手動で行う。
  suite-terraform:
    name: Suite / Terraform
    needs: changes
    if: >-
      needs.changes.outputs.terraform == 'true' || needs.changes.outputs.platform == 'true'
      || needs.changes.outputs.rag == 'true' || needs.changes.outputs.nl2sql == 'true' || needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.5.7"

      - name: Check shell scripts
        run: bash -n stack/extract_wallet.sh

      - name: Format check
        run: terraform fmt -check -recursive stack

      - name: Initialize Terraform
        working-directory: terraform/stack
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: terraform/stack
        run: terraform validate

      - name: Package stack
        run: python scripts/package_stack.py --output /tmp/production-ready-suite-terraform-stack.zip

      - name: Verify stack contract
        run: python scripts/verify_stack_contract.py /tmp/production-ready-suite-terraform-stack.zip

  # ---------------------------------------------------------------- 集約

  ci-ok:
    name: CI OK
    if: always()
    needs:
      - changes
      - secret-scan
      - platform-ui
      - platform-backend-core
      - platform-system-settings-backend
      - rag-backend
      - rag-engine
      - services-scripts-lint
      - rag-frontend
      - rag-e2e
      - rag-init-script
      - nl2sql-deploy-scripts
      - nl2sql-frontend
      - nl2sql-e2e
      - nl2sql-backend
      - agent-backend
      - agent-frontend
      - agent-e2e
      - agent-init-script
      - e2e-impact
      - rag-e2e-impact
      - nl2sql-e2e-impact
      - agent-e2e-impact
      - suite-terraform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # skip（変更のない製品）は成功扱い。failure / cancelled が1つでもあれば失敗させる。
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "job results: ${RESULTS}"
          if echo "${RESULTS}" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::失敗または中断された job があります。"
            exit 1
          fi
