name: Dependency Audit Nightly

# backend の依存の脆弱性（pip-audit）を毎晩 main で全件検査する（#339）。
# PR / main push の CI（ci.yml）は、その backend の uv.lock / pyproject.toml が変わったときだけ pip-audit を実行する
# （advisory の公開で無関係な PR が赤になるのを避けるため。bandit は PR でも毎回実行する）。
# 失敗は ci-failure-issue.yml が Issue にする。ignore する advisory は ci.yml と同じにし、理由をここと ci.yml に書く。

on:
  schedule:
    - cron: "30 18 * * *" # 03:30 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: ${{ matrix.name }} (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Platform / backend_core", dir: platform/packages/backend_core, args: "" }
          - { name: "Platform / system_settings_backend", dir: platform/packages/system_settings_backend, args: "" }
          - { name: "RAG / Backend", dir: rag/backend, args: "" }
          # OCI SDK が cryptography を <47.0.0 に制約し、GHSA-537c-gmf6-5ccf の修正版は 48.0.1（ci.yml と同じ）。
          - { name: "NL2SQL / Backend", dir: nl2sql/backend, args: "--ignore-vuln GHSA-537c-gmf6-5ccf" }
          - { name: "Agent / Backend", dir: agent/backend, args: "" }
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.dir }}/uv.lock
          save-cache: "false"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Dependency audit
        run: uv run pip-audit --skip-editable ${{ matrix.args }}

  # RAG の外部 parser のサービス（rag/services/parsers/<name>）。venv に pip-audit が無いので、ci.yml の
  # RAG / Parser <name> の job と同じく、lock から書き出した requirements（hash 付き）を検査する（#1513）。
  # 自分たちの package（path 依存）は PyPI に無いので書き出さない（--no-emit-local）。
  parser-pip-audit:
    name: RAG / Parser ${{ matrix.parser }} (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        parser: [docling, asr]
    defaults:
      run:
        working-directory: rag/services/parsers/${{ matrix.parser }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Dependency audit
        run: |
          version="$(sed -n '/^name = "pip-audit"$/{n;s/^version = "\(.*\)"$/\1/p;}' ../../../backend/uv.lock)"
          test -n "${version}"
          uv export --locked --no-dev --no-emit-local --format requirements.txt -o "${RUNNER_TEMP}/requirements.txt" -q
          uvx "pip-audit@${version}" --disable-pip -r "${RUNNER_TEMP}/requirements.txt"
