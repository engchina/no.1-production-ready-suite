name: Terraform Release Package

# OCI Resource Manager の統合 stack（terraform/stack、#217）の release。tag は suite-v*（例: suite-v0.1.0）。
# ADB 1つと、選んだ製品（RAG / NL2SQL / Agent）ごとの Compute を1つの zip で配る。
# 製品ごとの release（<製品>-v*、#94）は作らない（既存の release は残す）。
#   terraform/scripts/package_stack.py              → terraform/dist/production-ready-suite-terraform-stack.zip
#   terraform/scripts/verify_stack_contract.py <zip> → stack の契約検証
#
# 公開の前に確かめること（#1594）:
#   - release する commit が main にある（手動の実行は main の branch から。tag はその commit が main の祖先）。
#   - その commit で main の CI（ci.yml。push・schedule・手動）が成功している。Dependabot の自動 merge の commit は
#     push の CI が動かないので、毎日の schedule か `gh workflow run ci.yml --ref main` の成功を待ってから release する。
#   - 配備のテスト（platform/deploy/tests。ci.yml の Suite / Terraform と同じ）が通る。
# zip には provenance（actions/attest-build-provenance）を付ける。利用者は
# `gh attestation verify <zip> --repo engchina/no.1-production-ready-suite` で、この workflow が作ったことを確かめられる。

on:
  push:
    tags:
      - "suite-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "version（例: v0.1.0）。suite-<version> の tag と release を作る"
        required: true
        type: string

# 権限は job に渡す（#1594）。
permissions: {}

jobs:
  package:
    name: Package and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # release の作成と asset の upload
      contents: write
      # main の CI の成功の確認
      actions: read
      # provenance（Sigstore の署名と attestation の保存）
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: terraform
    env:
      PACKAGE_NAME: production-ready-suite-terraform-stack.zip
    steps:
      - name: Resolve release tag
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::手動の release は main の branch から実行する（実行した ref: $REF）"
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
          else
            tag="suite-$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^suite-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::invalid release tag: $tag (expected suite-vX.Y.Z)"
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # tag の commit が main の祖先かを確かめるため、履歴を取る。
          fetch-depth: 0

      - name: Check the commit is on main and its CI succeeded
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "::error::$TARGET_SHA は main にない。main に merge した commit だけを release する"
            exit 1
          fi
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}&status=success&per_page=20" \
            -q '[.workflow_runs[] | select(.event != "pull_request" and .head_branch == "main")] | length')"
          if [ "${runs:-0}" -eq 0 ]; then
            echo "::error::$TARGET_SHA で main の CI（ci.yml）の成功が無い。CI の成功を待ってから release する（Dependabot の自動 merge の commit は gh workflow run ci.yml --ref main）"
            exit 1
          fi
          echo "main の CI の成功を確かめた（$TARGET_SHA。成功した run: $runs）"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.5.7"

      # stack が cloud-init から呼ぶ各製品の init_script.sh を検証する。
      - name: Test deployment scripts
        working-directory: .
        run: |
          bash -n terraform/stack/extract_wallet.sh
          for product in rag nl2sql agent; do
            bash -n "$product/init_script.sh"
            echo "::group::$product/scripts/tests/init-script-deployment.test.sh"
            (cd "$product" && bash scripts/tests/init-script-deployment.test.sh)
            echo "::endgroup::"
          done

      # 1 台の Compute の配備（platform/deploy）。ci.yml の Suite / Terraform の同名の step と同じ内容にする。
      - name: Test single-Compute deployment (platform/deploy)
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx openssl
          bash -n platform/deploy/suite-init.sh platform/deploy/suite-nginx.sh platform/deploy/suite-tls.sh \
            platform/deploy/suite-pull.sh platform/deploy/suite-restart.sh platform/deploy/suite-update.sh
          bash platform/deploy/tests/suite-tls.test.sh
          bash platform/deploy/tests/suite-init.test.sh
          bash platform/deploy/tests/suite-nginx.test.sh
          bash platform/deploy/tests/suite-ops.test.sh

      - name: Format check
        run: terraform fmt -check -recursive stack

      - name: Validate Terraform
        working-directory: terraform/stack
        run: |
          terraform init -backend=false
          terraform validate

      - name: Build Terraform stack package
        run: python scripts/package_stack.py

      - name: Verify stack contract
        run: python scripts/verify_stack_contract.py "dist/$PACKAGE_NAME"

      - name: Write checksum
        run: |
          cd dist
          sha256sum "$PACKAGE_NAME" > "$PACKAGE_NAME.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: terraform/dist/${{ env.PACKAGE_NAME }}

      # workflow_dispatch では tag がまだ無いので、実行した commit に作る。push（tag）ではその tag を使う。
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$TARGET_SHA" \
              --title "$RELEASE_TAG" \
              --notes "OCI Resource Manager Terraform stack package for the Production Ready Suite (RAG / NL2SQL / Agent Control Plane on one shared Autonomous AI Database)."
          fi
          gh release upload "$RELEASE_TAG" \
            "dist/$PACKAGE_NAME" \
            "dist/$PACKAGE_NAME.sha256" \
            --clobber
