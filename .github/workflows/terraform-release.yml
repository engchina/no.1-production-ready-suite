name: Terraform Release Package

# monorepo の release は製品ごと（#94）。tag は <製品>-v*（nl2sql-v* / agent-v*）で、version も製品ごとに独立する。
# 各製品は <製品>/terraform/stack と、次の 2 本（必須）+ 1 本（任意）を用意する。
#   scripts/package_terraform_stack.py              → dist/production-ready-<製品>-terraform-stack.zip
#   scripts/verify_terraform_stack_contract.py <zip> → stack の契約検証
#   scripts/verify_terraform_release_extras.py <zip> → 製品固有の追加検証（あれば実行）

on:
  push:
    tags:
      - "nl2sql-v*"
      - "agent-v*"
  workflow_dispatch:
    inputs:
      products:
        description: "Release する製品（カンマ区切り。例: nl2sql,agent）"
        required: true
        type: string
      version:
        description: "version（例: v0.1.33）。製品ごとに <製品>-<version> の tag と release を作る"
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve release targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Resolve products and tags
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PRODUCTS: ${{ inputs.products }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re

          # stack を持つ製品だけを許可する（rag は #136 で stack ができたら足す）。
          allowed = {"nl2sql", "agent"}
          if os.environ["EVENT_NAME"] == "push":
              product, _, version = os.environ["REF_NAME"].partition("-")
              pairs = [(product, version)]
          else:
              version = os.environ["INPUT_VERSION"].strip()
              products = [p.strip() for p in os.environ["INPUT_PRODUCTS"].split(",") if p.strip()]
              pairs = [(p, version) for p in dict.fromkeys(products)]
          targets = []
          for product, version in pairs:
              if product not in allowed:
                  raise SystemExit(f"unknown product: {product} (allowed: {sorted(allowed)})")
              if not re.fullmatch(r"v\d+\.\d+\.\d+", version):
                  raise SystemExit(f"invalid version: {version} (expected vX.Y.Z)")
              targets.append({"product": product, "tag": f"{product}-{version}"})
          if not targets:
              raise SystemExit("no release targets")
          print("targets=" + json.dumps(targets))
          PY

  package:
    name: Package and publish (${{ matrix.target.tag }})
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
    defaults:
      run:
        working-directory: ${{ matrix.target.product }}
    env:
      PRODUCT: ${{ matrix.target.product }}
      RELEASE_TAG: ${{ matrix.target.tag }}
      PACKAGE_NAME: production-ready-${{ matrix.target.product }}-terraform-stack.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.5.7"

      - name: Test deployment scripts
        run: |
          for script in init_script.sh scripts/*.sh; do
            [ -f "$script" ] && bash -n "$script"
          done
          for test in scripts/tests/*.test.sh; do
            [ -f "$test" ] || continue
            echo "::group::$test"
            bash "$test"
            echo "::endgroup::"
          done

      - name: Format check
        run: terraform fmt -check -recursive terraform/stack

      - name: Validate Terraform
        working-directory: ${{ matrix.target.product }}/terraform/stack
        run: |
          terraform init -backend=false
          terraform validate

      - name: Build Terraform stack package
        run: python scripts/package_terraform_stack.py

      - name: Verify stack contract
        run: |
          python scripts/verify_terraform_stack_contract.py "dist/$PACKAGE_NAME"
          if [ -f scripts/verify_terraform_release_extras.py ]; then
            python scripts/verify_terraform_release_extras.py "dist/$PACKAGE_NAME"
          fi

      - name: Write checksum
        run: |
          cd dist
          sha256sum "$PACKAGE_NAME" > "$PACKAGE_NAME.sha256"

      # workflow_dispatch では tag がまだ無いので、実行した commit に作る。push（tag）ではその tag を使う。
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$TARGET_SHA" \
              --title "$RELEASE_TAG" \
              --notes "OCI Resource Manager Terraform stack package for Production Ready ${PRODUCT}."
          fi
          gh release upload "$RELEASE_TAG" \
            "dist/$PACKAGE_NAME" \
            "dist/$PACKAGE_NAME.sha256" \
            --clobber
