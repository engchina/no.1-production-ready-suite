name: production-ready-agent-control-plane

# 第三者の Agent Runtime（OpenClaw・Hermes・DeerFlow）を、公式の構築済みイメージ（`image@sha256` で固定）で
# 起動する compose。自前のコード（Control Plane の backend・runtime-dispatcher・frontend）は Docker を使わず、
# ネイティブ（開発は `uv run`、本番は systemd）で動かす（#286 / #356。agent/README.md）。
# project 名は以前（Control Plane も compose で動かしていた頃）と同じにして、Runtime の volume を引き継ぐ。
#
# - 各 Runtime は profile（openclaw / hermes / deerflow）で opt-in する。Docker socket は mount しない。
# - Control Plane の Runtime サービスの起動・停止（`AGENT_RUNTIME_SERVICE_CONTROL_ENABLED=true` のときだけ）は、
#   agent/ でこの compose に `docker compose --profile <profile> ...` を実行する。
# - この compose の `.env`（`.env.runtime.example` から作る）は下の ${...} の補間にだけ使う。
#   Runtime API の認証値は Control Plane（backend）と同じ値にする（Runtime 定義の auth_secret_ref が参照する）。
# - Control Plane が Binding ごとに書き出す Skill / MCP の閉包（AGENT_RUNTIME_BINDINGS_DIR）を、各 Runtime へ
#   読み取り専用で渡す。host 側の場所は AGENT_RUNTIME_BINDINGS_HOST_DIR（既定は開発の backend の既定と同じ
#   `backend/.agent-runtime-bindings`）。
# - Runtime から host で動く Control Plane（Binding MCP）へは host.docker.internal で届く
#   （AGENT_CONTROL_PLANE_PUBLIC_BASE_URL。agent/README.md）。

x-runtime-bindings-volume: &runtime-bindings-volume "${AGENT_RUNTIME_BINDINGS_HOST_DIR:-./backend/.agent-runtime-bindings}:/var/lib/control-plane/bindings:ro"

x-runtime-extra-hosts: &runtime-extra-hosts
  - "host.docker.internal:host-gateway"

services:
  runtime-openclaw:
    profiles: [openclaw]
    image: ghcr.io/openclaw/openclaw@sha256:af7ea052cf216f581fb18fabada01552356c53717461c0399b623cba7ecad4b1
    restart: unless-stopped
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      # OpenClaw が期待する名前へ、Agent の AGENT_OPENCLAW_GATEWAY_TOKEN を渡す。
      OPENCLAW_GATEWAY_TOKEN: ${AGENT_OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_DISABLE_BONJOUR: "1"
    ports:
      - "${OPENCLAW_PORT:-18789}:18789"
    volumes:
      - openclaw-state:/home/node/.openclaw
      - openclaw-auth:/home/node/.config/openclaw
      - *runtime-bindings-volume
    extra_hosts: *runtime-extra-hosts
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:18789/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    cap_drop: [NET_RAW, NET_ADMIN]
    security_opt:
      - no-new-privileges:true

  runtime-hermes:
    profiles: [hermes]
    image: docker.io/nousresearch/hermes-agent@sha256:245b638344f8db4a67a18d487bc4d0a9d80c29aec3ae577da5aa9780a419e8d2
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      API_SERVER_HOST: 0.0.0.0
      # Hermes が期待する名前へ、Agent の AGENT_HERMES_API_SERVER_KEY を渡す。
      API_SERVER_KEY: ${AGENT_HERMES_API_SERVER_KEY:-}
    ports:
      - "${HERMES_PORT:-8642}:8642"
    volumes:
      - hermes-state:/opt/data
      - *runtime-bindings-volume
    extra_hosts: *runtime-extra-hosts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  runtime-deerflow:
    profiles: [deerflow]
    image: ghcr.io/bytedance/deer-flow@sha256:bd3e961b52095a1cb92762458725c2c49f85a2385b4705b43674d32c9db1fa8a
    restart: unless-stopped
    environment:
      # DeerFlow が期待する名前へ、Agent の AGENT_DEER_FLOW_INTERNAL_AUTH_TOKEN を渡す。
      DEER_FLOW_INTERNAL_AUTH_TOKEN: ${AGENT_DEER_FLOW_INTERNAL_AUTH_TOKEN:-}
    ports:
      - "${DEERFLOW_PORT:-2026}:2026"
    volumes:
      - deerflow-state:/app/.deer-flow
      - *runtime-bindings-volume
    extra_hosts: *runtime-extra-hosts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2026/api/models', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  openclaw-state:
  openclaw-auth:
  hermes-state:
  deerflow-state:
