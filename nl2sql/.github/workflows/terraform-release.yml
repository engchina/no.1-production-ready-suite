name: Terraform Release Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package and publish Terraform stack
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: production-ready-nl2sql-terraform-stack.zip
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Format check
        run: terraform fmt -check -recursive terraform/stack

      - name: Initialize Terraform
        working-directory: terraform/stack
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: terraform/stack
        run: terraform validate

      - name: Build Terraform stack package
        run: python scripts/package_terraform_stack.py

      - name: Verify package contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          package = Path("dist/production-ready-nl2sql-terraform-stack.zip")
          with zipfile.ZipFile(package) as archive:
              locals_tf = archive.read("locals.tf").decode()
              schema_yaml = archive.read("schema.yaml").decode()
          if "APP_ADMIN_USERNAME=" not in locals_tf or "APP_ADMIN_PASSWORD=" not in locals_tf:
              raise SystemExit("APP_ADMIN credentials are missing from backend.env")
          if "first SYSTEM_ADMIN web login" in schema_yaml:
              raise SystemExit("ADB password is still described as a web login password")
          print("Terraform package APP_ADMIN checks verified.")
          PY

      - name: Write checksum
        run: |
          cd dist
          sha256sum "$PACKAGE_NAME" > "$PACKAGE_NAME.sha256"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "OCI Resource Manager Terraform stack package for Production Ready NL2SQL."
          fi
          gh release upload "$RELEASE_TAG" \
            "dist/$PACKAGE_NAME" \
            "dist/$PACKAGE_NAME.sha256" \
            --clobber
