# 3製品共通の設定は platform の共通 .env（#211）。backend / worker は PLATFORM_ENV_FILE の
# 場所から読み、システム設定画面の保存もそこへ書く（ディレクトリごと書き込み可能でマウントする）。
# 共通 .env は env_file で注入しない（環境変数が優先され、画面で保存した値が反映されなくなる）。
# 既定は monorepo の platform/（platform/.env と platform/model-settings.json）。PLATFORM_ENV_DIR で変更できる。
services:
  backend:
    build:
      context: ..
      dockerfile: nl2sql/backend/Dockerfile
    env_file:
      - backend/.env.example
    environment:
      PLATFORM_ENV_FILE: /app/platform-env/.env
      # 保存先は ontology-source-data の volume に合わせて compose が決める（共通 .env の値より優先）。
      PLATFORM_LOCAL_STORAGE_DIR: /u01/data/production-ready-nl2sql
      NL2SQL_ENVIRONMENT: ${NL2SQL_ENVIRONMENT:-local}
      NL2SQL_DEBUG: ${NL2SQL_DEBUG:-true}
      NL2SQL_CORS_ORIGINS: '["http://localhost:3001","http://127.0.0.1:3001"]'
      NL2SQL_RUNTIME_MODE: ${NL2SQL_RUNTIME_MODE:-deterministic}
      NL2SQL_PERSISTENCE_MODE: ${NL2SQL_PERSISTENCE_MODE:-oracle}
      NL2SQL_SYNTHETIC_WORKER_MODE: external
      NL2SQL_JOB_WORKER_MODE: ${NL2SQL_JOB_WORKER_MODE:-external}
      NL2SQL_ONTOLOGY_WORKER_MODE: ${NL2SQL_ONTOLOGY_WORKER_MODE:-inprocess}
      NL2SQL_SCHEMA_REFRESH_WORKER_MODE: ${NL2SQL_SCHEMA_REFRESH_WORKER_MODE:-external}
      NL2SQL_QUALITY_EVALUATION_WORKER_MODE: ${NL2SQL_QUALITY_EVALUATION_WORKER_MODE:-external}
    volumes:
      - ontology-source-data:/u01/data/production-ready-nl2sql/ontology-sources
      - ${PLATFORM_ENV_DIR:-../platform}:/app/platform-env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 20s
      timeout: 5s
      retries: 5

  ontology-worker:
    profiles: ["ontology"]
    build:
      context: ..
      dockerfile: nl2sql/backend/Dockerfile
    command: ["python", "-m", "app.features.nl2sql.ontology_worker"]
    env_file:
      - backend/.env.example
    environment:
      PLATFORM_ENV_FILE: /app/platform-env/.env
      # 保存先は ontology-source-data の volume に合わせて compose が決める（共通 .env の値より優先）。
      PLATFORM_LOCAL_STORAGE_DIR: /u01/data/production-ready-nl2sql
      NL2SQL_RUNTIME_MODE: ${NL2SQL_RUNTIME_MODE:-oracle}
      NL2SQL_PERSISTENCE_MODE: ${NL2SQL_PERSISTENCE_MODE:-oracle}
      NL2SQL_ONTOLOGY_WORKER_MODE: external
    volumes:
      - ontology-source-data:/u01/data/production-ready-nl2sql/ontology-sources
      - ${PLATFORM_ENV_DIR:-../platform}:/app/platform-env

  nl2sql-job-worker:
    build:
      context: ..
      dockerfile: nl2sql/backend/Dockerfile
    command: ["python", "-m", "app.cli.nl2sql_job_worker"]
    env_file:
      - backend/.env.example
    environment:
      PLATFORM_ENV_FILE: /app/platform-env/.env
      NL2SQL_RUNTIME_MODE: ${NL2SQL_RUNTIME_MODE:-deterministic}
      NL2SQL_PERSISTENCE_MODE: ${NL2SQL_PERSISTENCE_MODE:-oracle}
      NL2SQL_JOB_WORKER_MODE: external
    volumes:
      - ${PLATFORM_ENV_DIR:-../platform}:/app/platform-env

  schema-refresh-worker:
    build:
      context: ..
      dockerfile: nl2sql/backend/Dockerfile
    command: ["python", "-m", "app.cli.nl2sql_schema_refresh_worker", "--poll-seconds", "1"]
    env_file:
      - backend/.env.example
    environment:
      PLATFORM_ENV_FILE: /app/platform-env/.env
      NL2SQL_RUNTIME_MODE: ${NL2SQL_RUNTIME_MODE:-oracle}
      NL2SQL_PERSISTENCE_MODE: ${NL2SQL_PERSISTENCE_MODE:-oracle}
      NL2SQL_SCHEMA_REFRESH_WORKER_MODE: external
    volumes:
      - ${PLATFORM_ENV_DIR:-../platform}:/app/platform-env

  quality-evaluation-worker:
    build:
      context: ..
      dockerfile: nl2sql/backend/Dockerfile
    command: ["python", "-m", "app.cli.nl2sql_quality_evaluation_worker"]
    env_file:
      - backend/.env.example
    environment:
      PLATFORM_ENV_FILE: /app/platform-env/.env
      NL2SQL_RUNTIME_MODE: ${NL2SQL_RUNTIME_MODE:-oracle}
      NL2SQL_PERSISTENCE_MODE: ${NL2SQL_PERSISTENCE_MODE:-oracle}
      NL2SQL_QUALITY_EVALUATION_WORKER_MODE: external
    volumes:
      - ${PLATFORM_ENV_DIR:-../platform}:/app/platform-env

  synthetic-data-worker:
    build:
      context: ..
      dockerfile: nl2sql/backend/Dockerfile
    command: ["python", "-m", "app.cli.nl2sql_synthetic_worker"]
    env_file:
      - backend/.env.example
    environment:
      PLATFORM_ENV_FILE: /app/platform-env/.env
      NL2SQL_RUNTIME_MODE: ${NL2SQL_RUNTIME_MODE:-oracle}
      NL2SQL_PERSISTENCE_MODE: ${NL2SQL_PERSISTENCE_MODE:-oracle}
      NL2SQL_SYNTHETIC_WORKER_MODE: external
    volumes:
      - ${PLATFORM_ENV_DIR:-../platform}:/app/platform-env

  frontend:
    build:
      context: ..
      dockerfile: nl2sql/frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:80"

volumes:
  ontology-source-data:
