#cloud-config
output: {all: '| tee -a /var/log/cloud-init-custom.log'}
bootcmd:
  - mkdir -p /u01/aipoc/props ${wallet_dir_host}
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - dos2unix
  - git
  - netfilter-persistent
  - unzip
write_files:
  - path: "/u01/aipoc/props/backend.env"
    permissions: "0600"
    owner: "root:root"
    encoding: "gzip+base64"
    content: |
      ${backend_env}
  - path: "/u01/aipoc/props/wallet.zip"
    permissions: "0600"
    owner: "root:root"
    encoding: "base64"
    content: |
      ${wallet_content}
  - path: "/u01/aipoc/props/adb_name.txt"
    permissions: "0644"
    content: |
      ${adb_name}
  - path: "/u01/aipoc/props/adb_dsn.txt"
    permissions: "0644"
    content: |
      ${db_dsn}
  - path: "/u01/aipoc/props/adb_ocid.txt"
    permissions: "0644"
    content: |
      ${adb_ocid}
  - path: "/u01/aipoc/props/compartment_ocid.txt"
    permissions: "0644"
    content: |
      ${compartment_ocid}
  - path: "/u01/aipoc/props/region.txt"
    permissions: "0644"
    content: |
      ${region}
  - path: "/u01/aipoc/props/application_port.txt"
    permissions: "0644"
    content: |
      ${application_port}
  - path: "/u01/aipoc/bootstrap-nl2sql.sh"
    permissions: "0755"
    owner: "root:root"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      export DEBIAN_FRONTEND=noninteractive

      APP_ROOT="/u01/aipoc"
      APP_REPO_DIR="$${APP_ROOT}/no.1-production-ready-nl2sql"
      PLATFORM_REPO_DIR="$${APP_ROOT}/no.1-production-ready-platform"
      APPLICATION_PORT="${application_port}"

      log() {
        printf '[nl2sql-bootstrap] %s\n' "$*"
      }

      trap 'status=$?; log "Bootstrap failed at line $${LINENO} with status $${status}: $${BASH_COMMAND}"; exit "$${status}"' ERR

      run_with_retries() {
        local attempts="$1"
        shift
        local attempt status
        status=0
        for attempt in $(seq 1 "$${attempts}"); do
          if "$@"; then
            return 0
          fi
          status="$?"
          log "Command failed with status $${status} on attempt $${attempt}/$${attempts}: $*"
          sleep $((attempt * 5))
        done
        return "$${status}"
      }

      clone_or_update_repo() {
        local url="$1"
        local ref="$2"
        local dest="$3"
        if [ -d "$${dest}/.git" ]; then
          log "Updating $${dest} to $${ref}."
          run_with_retries 5 git -C "$${dest}" fetch --depth 1 origin "$${ref}"
          git -C "$${dest}" checkout -f FETCH_HEAD
        else
          log "Cloning $${url} ($${ref}) to $${dest}."
          run_with_retries 5 git clone --branch "$${ref}" --depth 1 --single-branch "$${url}" "$${dest}"
        fi
      }

      configure_firewall() {
        if command -v iptables >/dev/null 2>&1; then
          iptables -I INPUT 6 -m state --state NEW -p tcp --dport "$${APPLICATION_PORT}" -j ACCEPT || true
          netfilter-persistent save || true
        fi
      }

      run_application_init() {
        local init_script="$${APP_REPO_DIR}/init_script.sh"
        if [ ! -f "$${init_script}" ]; then
          log "Missing application init script: $${init_script}"
          return 1
        fi
        dos2unix "$${init_script}" || true
        chmod +x "$${init_script}"
        log "Starting direct Compute initialization via $${init_script}."
        APPLICATION_PORT="$${APPLICATION_PORT}" APP_ROOT="$${APP_ROOT}" bash "$${init_script}"
      }

      configure_firewall
      clone_or_update_repo "${application_git_url}" "${application_git_ref}" "$${APP_REPO_DIR}"
      clone_or_update_repo "${platform_git_url}" "${platform_git_ref}" "$${PLATFORM_REPO_DIR}"
      run_application_init
      log "Deployment finished. Nginx listens on TCP port $${APPLICATION_PORT}."
runcmd:
  - "nohup bash /u01/aipoc/bootstrap-nl2sql.sh >> /var/log/cloud-init-custom.log 2>&1 &"
