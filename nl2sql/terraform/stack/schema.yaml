title: "Deploy Production Ready NL2SQL on Oracle Cloud Infrastructure"
stackDescription: "Deploy Production Ready NL2SQL on an OCI Compute instance with Oracle Autonomous Database 26ai, Docker Compose, OCI Enterprise AI, and OCI Generative AI."
schemaVersion: 1.1.0
version: "20260813"
locale: "en"

variableGroups:
  - title: Hidden
    visible: false
    variables:
      - adb_compute_model
      - adb_use_private_subnet

  - title: Required Configuration
    visible: true
    variables:
      - region
      - compartment_ocid
      - availability_domain
      - vcn_ai_vcn_id

  - title: Application Source
    visible: true
    variables:
      - application_git_url
      - application_git_ref
      - platform_git_url
      - platform_git_ref
      - application_port
      - app_environment
      - app_auth_cookie_secure

  - title: Autonomous Database
    visible: true
    variables:
      - adb_display_name
      - adb_name
      - adb_workload
      - adb_db_version
      - adb_compute_count
      - adb_is_auto_scaling_enabled
      - adb_data_storage_size_in_tbs
      - adb_is_auto_scaling_for_storage_enabled
      - adb_is_elastic_pool_enabled
      - adb_resource_pool_size
      - adb_resource_pool_storage_size_in_tbs
      - license_model
      - adb_backup_retention_period_in_days
      - adb_password
      - adb_network_access_type
      - adb_subnet_id
      - adb_acl_notation_type
      - adb_acl_vcn_id
      - adb_acl_subnet_id
      - adb_acl_cidr_blocks
      - adb_is_mtls_connection_required

  - title: AI Runtime
    visible: true
    variables:
      - oci_auth_mode
      - oci_enterprise_ai_endpoint
      - oci_enterprise_ai_project_ocid
      - oci_enterprise_ai_api_key
      - oci_enterprise_ai_models_json
      - oci_enterprise_ai_default_model
      - oci_enterprise_ai_llm_model
      - oci_enterprise_ai_vlm_model
      - oci_genai_endpoint
      - oci_genai_embed_model_id
      - oci_genai_rerank_model_id
      - nl2sql_select_ai_credential_name
      - nl2sql_select_ai_model

  - title: Compute
    visible: true
    variables:
      - instance_display_name
      - instance_image_source_id
      - instance_shape
      - instance_flex_shape_ocpus
      - instance_flex_shape_memory
      - instance_boot_volume_size
      - instance_boot_volume_vpus
      - subnet_ai_subnet_id
      - ssh_authorized_keys

variables:
  region:
    title: Region
    type: oci:identity:region:name
    required: true
    visible: false
    default: "ap-osaka-1"

  compartment_ocid:
    type: oci:identity:compartment:id
    required: true
    visible: true
    title: "Create in compartment"

  availability_domain:
    type: oci:identity:availabilitydomain:name
    required: true
    visible: true
    title: "Availability domain"
    dependsOn:
      region: ${region}
      compartmentId: ${compartment_ocid}

  vcn_ai_vcn_id:
    type: oci:core:vcn:id
    required: true
    visible: true
    title: "VCN"
    description: "Select an existing virtual cloud network."
    dependsOn:
      compartmentId: ${compartment_ocid}

  application_git_url:
    type: string
    required: true
    visible: true
    title: "Application Git URL"
    default: "https://github.com/engchina/no.1-production-ready-nl2sql.git"

  application_git_ref:
    type: string
    required: true
    visible: true
    title: "Application Git ref"
    description: "Branch or tag to clone. The default deploys main."
    default: "main"

  platform_git_url:
    type: string
    required: true
    visible: true
    title: "Platform Git URL"
    default: "https://github.com/engchina/no.1-production-ready-platform.git"

  platform_git_ref:
    type: string
    required: true
    visible: true
    title: "Platform Git ref"
    description: "Branch or tag for shared backend/ui packages."
    default: "main"

  application_port:
    type: number
    required: true
    visible: true
    title: "Application port"
    description: "TCP port exposed by the frontend container and instance firewall."
    default: 3001

  app_environment:
    type: enum
    required: true
    visible: true
    title: "Application environment"
    description: "Use local for direct HTTP access. Use production only behind HTTPS and set Secure cookies."
    enum:
      - "local"
      - "staging"
      - "production"
    default: "local"

  app_auth_cookie_secure:
    type: boolean
    required: true
    visible: true
    title: "Secure auth cookies"
    description: "Set true when the app is served through HTTPS."
    default: false

  adb_display_name:
    type: string
    required: false
    visible: true
    title: "ADB display name"
    description: "Leave blank to use the database name."

  adb_name:
    type: string
    required: true
    visible: true
    title: "Database name"
    description: "ADB database name. Default is NL2SQLADB."
    default: "NL2SQLADB"
    pattern: "^[A-Za-z][A-Za-z0-9]{0,13}$"

  adb_workload:
    type: enum
    required: true
    visible: true
    title: "Workload type"
    enum:
      - "OLTP"
      - "DW"
      - "AJD"
      - "APEX"
      - "LH"
    default: "DW"

  adb_db_version:
    type: enum
    required: true
    visible: true
    title: "Database version"
    enum:
      - "19c"
      - "23ai"
      - "26ai"
    default: "26ai"

  adb_compute_model:
    type: enum
    required: true
    visible: false
    title: "Compute model"
    enum:
      - "ECPU"
      - "OCPU"
    default: "ECPU"

  adb_compute_count:
    type: number
    required: true
    visible: true
    title: "ECPU count"
    default: 2

  adb_is_auto_scaling_enabled:
    type: boolean
    required: true
    visible: true
    title: "CPU auto scaling"
    default: false

  adb_data_storage_size_in_tbs:
    type: number
    required: true
    visible: true
    title: "Storage (TB)"
    default: 1

  adb_is_auto_scaling_for_storage_enabled:
    type: boolean
    required: true
    visible: true
    title: "Storage auto scaling"
    default: false

  adb_is_elastic_pool_enabled:
    type: boolean
    required: true
    visible: true
    title: "Enable elastic pool"
    default: false

  adb_resource_pool_size:
    type: number
    required: true
    visible:
      eq:
        - adb_is_elastic_pool_enabled
        - true
    title: "Elastic pool size"
    default: 0

  adb_resource_pool_storage_size_in_tbs:
    type: number
    required: true
    visible:
      eq:
        - adb_is_elastic_pool_enabled
        - true
    title: "Elastic pool storage (TB)"
    default: 0

  license_model:
    type: enum
    required: true
    visible: true
    title: "License type"
    enum:
      - "BRING_YOUR_OWN_LICENSE"
      - "LICENSE_INCLUDED"
    default: "LICENSE_INCLUDED"

  adb_backup_retention_period_in_days:
    type: number
    required: true
    visible: true
    title: "Automatic backup retention period (days)"
    default: 1

  adb_password:
    type: password
    required: true
    visible: true
    title: "Database ADMIN password"
    description: "Used for the ADB ADMIN user, wallet password, Oracle connection password, and first SYSTEM_ADMIN web login."
    confirmation: true
    pattern: "^(?!.*admin)(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?!.*[\"]).{12,30}$"

  adb_network_access_type:
    type: enum
    required: true
    visible: true
    title: "ADB network access"
    enum:
      - "PUBLIC_ENDPOINT"
      - "SECURE_ACCESS_FROM_ALLOWED_IPS_AND_VCNS"
      - "PRIVATE_ENDPOINT_ONLY"
    default: "PRIVATE_ENDPOINT_ONLY"

  adb_use_private_subnet:
    type: boolean
    required: true
    visible: false
    title: "Use private subnet for ADB"
    default: false

  adb_subnet_id:
    type: oci:core:subnet:id
    required: true
    visible:
      eq:
        - adb_network_access_type
        - "PRIVATE_ENDPOINT_ONLY"
    title: "ADB private endpoint subnet"
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${vcn_ai_vcn_id}

  adb_acl_notation_type:
    type: enum
    required: true
    visible:
      eq:
        - adb_network_access_type
        - "SECURE_ACCESS_FROM_ALLOWED_IPS_AND_VCNS"
    title: "ADB ACL notation type"
    enum:
      - "VCN"
      - "CIDR_BLOCK"
    default: "VCN"

  adb_acl_vcn_id:
    type: oci:core:vcn:id
    required: true
    visible:
      eq:
        - adb_network_access_type
        - "SECURE_ACCESS_FROM_ALLOWED_IPS_AND_VCNS"
    title: "Allowed VCN"
    dependsOn:
      compartmentId: ${compartment_ocid}

  adb_acl_subnet_id:
    type: oci:core:subnet:id
    required: false
    visible:
      eq:
        - adb_network_access_type
        - "SECURE_ACCESS_FROM_ALLOWED_IPS_AND_VCNS"
    title: "Allowed subnet"
    description: "Optional. When selected, the subnet CIDR is added as VCN;CIDR in the ADB access list."
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${adb_acl_vcn_id}

  adb_acl_cidr_blocks:
    type: string
    required: false
    visible:
      eq:
        - adb_acl_notation_type
        - "CIDR_BLOCK"
    title: "Allowed CIDR blocks"
    description: "Comma-separated CIDR blocks for ADB secure access."

  adb_is_mtls_connection_required:
    type: boolean
    required: true
    visible: true
    title: "Require mutual TLS (mTLS)"
    default: true

  oci_auth_mode:
    type: enum
    required: true
    visible: true
    title: "OCI runtime auth mode"
    description: "instance_principal requires a dynamic group and IAM policy for the Compute instance."
    enum:
      - "instance_principal"
      - "config_file"
      - "resource_principal"
    default: "instance_principal"

  oci_enterprise_ai_endpoint:
    type: string
    required: true
    visible: true
    title: "Enterprise AI endpoint"

  oci_enterprise_ai_project_ocid:
    type: string
    required: false
    visible: true
    title: "Enterprise AI project OCID"

  oci_enterprise_ai_api_key:
    type: password
    required: true
    visible: true
    title: "Enterprise AI API key"
    confirmation: true
    pattern: "^[^\r\n]*$"

  oci_enterprise_ai_models_json:
    type: string
    required: false
    visible: true
    title: "Enterprise AI models JSON"
    description: "JSON array for OCI_ENTERPRISE_AI_MODELS. Leave [] to use the model fields below."
    default: "[]"

  oci_enterprise_ai_default_model:
    type: string
    required: false
    visible: true
    title: "Enterprise AI default model"

  oci_enterprise_ai_llm_model:
    type: string
    required: true
    visible: true
    title: "Enterprise AI LLM model"

  oci_enterprise_ai_vlm_model:
    type: string
    required: false
    visible: true
    title: "Enterprise AI VLM model"

  oci_genai_endpoint:
    type: string
    required: true
    visible: true
    title: "Generative AI endpoint"
    description: "Used only for Cohere embedding and rerank."

  oci_genai_embed_model_id:
    type: string
    required: true
    visible: true
    title: "Embedding model ID"
    default: "cohere.embed-v4.0"

  oci_genai_rerank_model_id:
    type: string
    required: true
    visible: true
    title: "Rerank model ID"
    default: "cohere.rerank-v4.0-fast"

  nl2sql_select_ai_credential_name:
    type: string
    required: false
    visible: true
    title: "Select AI credential name"

  nl2sql_select_ai_model:
    type: string
    required: false
    visible: true
    title: "Select AI model"

  instance_display_name:
    type: string
    required: true
    visible: true
    title: "Compute instance name"
    default: "NL2SQL_INSTANCE"

  instance_image_source_id:
    type: enum
    required: true
    visible: true
    title: "Compute image"
    description: "Choose the Ubuntu image according to your region."
    enum:
      - "ocid1.image.oc1.ap-tokyo-1.aaaaaaaaoiusqhftxmiyjlulnxx5mdnqfv6pjx4hdcoks3exn7gsrcwpkpdq"
      - "ocid1.image.oc1.ap-osaka-1.aaaaaaaa7sbmd5q54w466eojxqwqfvvp554awzjpt2behuwsiefrxnwomq5a"
      - "ocid1.image.oc1.us-chicago-1.aaaaaaaal25tbfrlwhh27tzgiatqr3oq5y3qzz7wgpezjouvjk2cdfdr4mnq"
    default: "ocid1.image.oc1.ap-osaka-1.aaaaaaaa7sbmd5q54w466eojxqwqfvvp554awzjpt2behuwsiefrxnwomq5a"

  instance_shape:
    type: enum
    required: true
    visible: true
    title: "Compute shape"
    enum:
      - "VM.Standard.E4.Flex"
      - "VM.Standard.E5.Flex"
    default: "VM.Standard.E5.Flex"

  instance_flex_shape_ocpus:
    type: number
    required: true
    visible: true
    title: "Compute OCPUs"
    default: 2

  instance_flex_shape_memory:
    type: number
    required: true
    visible: true
    title: "Compute memory (GB)"
    default: 16

  instance_boot_volume_size:
    type: number
    required: true
    visible: true
    title: "Boot volume size (GB)"
    default: 100

  instance_boot_volume_vpus:
    type: number
    required: true
    visible: true
    title: "Boot volume VPUs/GB"
    default: 10

  subnet_ai_subnet_id:
    type: oci:core:subnet:id
    required: true
    visible: true
    title: "Compute subnet"
    description: "Select a public or private subnet. Public IP assignment is detected automatically from the selected subnet."
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${vcn_ai_vcn_id}

  ssh_authorized_keys:
    type: oci:core:ssh:publickey
    required: true
    visible: true
    title: "SSH public key"
    description: "Upload a public key for the ubuntu user."

outputs:
  autonomous_database_ocid:
    title: "Autonomous Database OCID"
    displayText: "Autonomous Database OCID"
    type: copyableString
    visible: true

  autonomous_database_high_connection_string:
    title: "Autonomous Database HIGH connection string"
    displayText: "Autonomous Database HIGH connection string"
    type: copyableString
    visible: true

  ssh_to_instance:
    title: "SSH command"
    displayText: "SSH command"
    type: copyableString
    visible: true

  application_url:
    title: "Application URL"
    displayText: "Application URL"
    type: copyableString
    visible: true
