title: "Deploy Production Ready NL2SQL on Oracle Cloud Infrastructure"
stackDescription: "Deploy Production Ready NL2SQL on an OCI Compute instance with Oracle Autonomous AI Database 26ai, Nginx, and systemd. Configure AI runtime settings after startup from the application System Settings."
schemaVersion: 1.1.0
version: "20260817"
locale: "en"

variableGroups:
  - title: Hidden
    visible: false
    variables:
      - adb_compute_model
      - adb_use_private_subnet
      - app_environment
      - app_auth_cookie_secure

  - title: Required Configuration
    visible: true
    variables:
      - region
      - compartment_ocid
      - availability_domain
      - vcn_ai_vcn_id

  - title: Application Source
    visible: true
    variables:
      - application_git_url
      - application_git_ref
      - platform_git_url
      - platform_git_ref
      - application_port

  - title: Application Administrator
    visible: true
    variables:
      - app_admin_login_user_id
      - app_admin_password

  - title: Deep Data Security
    visible: true
    variables:
      - oracle_deepsec_data_user_password

  - title: Autonomous AI Database
    visible: true
    variables:
      - adb_deployment_mode

  - title: Existing Autonomous AI Database
    visible:
      eq:
        - adb_deployment_mode
        - "既存の Autonomous AI Database を選択"
    variables:
      - existing_adb_ocid
      - existing_oracle_user
      - existing_oracle_password
      - existing_oracle_dsn
      - existing_oracle_wallet_password

  - title: New Autonomous AI Database
    visible:
      eq:
        - adb_deployment_mode
        - "新規 Autonomous AI Database の作成"
    variables:
      - adb_display_name
      - adb_name
      - adb_workload
      - adb_db_version
      - adb_compute_count
      - adb_is_auto_scaling_enabled
      - adb_data_storage_size_in_tbs
      - adb_is_auto_scaling_for_storage_enabled
      - adb_is_elastic_pool_enabled
      - adb_resource_pool_size
      - adb_resource_pool_storage_size_in_tbs
      - license_model
      - adb_backup_retention_period_in_days
      - adb_password
      - adb_network_access_type
      - adb_subnet_id
      - adb_acl_notation_type
      - adb_acl_vcn_id
      - adb_acl_subnet_id
      - adb_acl_cidr_blocks
      - adb_is_mtls_connection_required

  - title: Compute
    visible: true
    variables:
      - instance_display_name
      - instance_image_source_id
      - instance_shape
      - instance_flex_shape_ocpus
      - instance_flex_shape_memory
      - instance_boot_volume_size
      - instance_boot_volume_vpus
      - subnet_ai_subnet_id
      - ssh_authorized_keys

variables:
  region:
    title: Region
    type: oci:identity:region:name
    required: true
    visible: false
    default: "ap-osaka-1"

  compartment_ocid:
    type: oci:identity:compartment:id
    required: true
    visible: true
    title: "Create in compartment"

  availability_domain:
    type: oci:identity:availabilitydomain:name
    required: true
    visible: true
    title: "Availability domain"
    dependsOn:
      region: ${region}
      compartmentId: ${compartment_ocid}

  vcn_ai_vcn_id:
    type: oci:core:vcn:id
    required: true
    visible: true
    title: "VCN"
    description: "Select an existing virtual cloud network."
    dependsOn:
      compartmentId: ${compartment_ocid}

  application_git_url:
    type: string
    required: true
    visible: true
    title: "Application Git URL"
    default: "https://github.com/engchina/no.1-production-ready-nl2sql.git"

  application_git_ref:
    type: string
    required: true
    visible: true
    title: "Application Git ref"
    description: "Branch or tag to clone. The default deploys main."
    default: "main"

  platform_git_url:
    type: string
    required: true
    visible: true
    title: "Platform Git URL"
    default: "https://github.com/engchina/no.1-production-ready-platform.git"

  platform_git_ref:
    type: string
    required: true
    visible: true
    title: "Platform Git ref"
    description: "Branch or tag for shared backend/ui packages."
    default: "main"

  application_port:
    type: number
    required: true
    visible: true
    title: "Application port"
    description: "TCP port exposed by host Nginx and the instance firewall."
    default: 80

  app_environment:
    type: enum
    required: true
    visible: false
    title: "Application environment"
    description: "Use local for direct HTTP access. Use production only behind HTTPS and set Secure cookies."
    enum:
      - "local"
      - "staging"
      - "production"
    default: "local"

  app_auth_cookie_secure:
    type: boolean
    required: true
    visible: false
    title: "Secure auth cookies"
    description: "Set true when the app is served through HTTPS."
    default: false

  app_admin_login_user_id:
    type: enum
    required: true
    visible: true
    title: "Application administrator login user ID"
    description: "Fixed login user ID for the built-in SYSTEM_ADMIN configuration administrator. It must be exactly system_admin and is independent from the database connection user."
    enum:
      - "system_admin"
    default: "system_admin"

  app_admin_password:
    type: password
    required: true
    visible: true
    title: "Application administrator password"
    description: "Login password for the built-in SYSTEM_ADMIN configuration administrator. Uses the same rule as the database password."
    confirmation: true
    pattern: '^[^"\r\n]{12,30}$'

  oracle_deepsec_data_user_password:
    type: password
    required: true
    visible: true
    title: "DeepSec DATA USER password"
    description: "Value written to ORACLE_DEEPSEC_DATA_USER_PASSWORD for the shared DEEPSEC_DATA_USER Deep Data Security data connection."
    confirmation: true
    pattern: '^[^"\r\n]{12,256}$'

  adb_deployment_mode:
    type: enum
    required: true
    visible: true
    title: "Autonomous AI Database deployment mode"
    description: "Create a new Autonomous AI Database, or connect this Compute deployment to an existing Autonomous AI Database in the selected region."
    enum:
      - "新規 Autonomous AI Database の作成"
      - "既存の Autonomous AI Database を選択"
    default: "新規 Autonomous AI Database の作成"

  existing_adb_ocid:
    type: oci:database:autonomousdatabase:id
    required: false
    visible: true
    title: "Existing Autonomous AI Database"
    description: "Select the existing ADB. Terraform will generate a wallet for this database and inject the connection settings into backend/.env."
    dependsOn:
      compartmentId: ${compartment_ocid}

  existing_oracle_user:
    type: string
    required: false
    visible: true
    title: "Existing DB username"
    description: "Value written to ORACLE_USER in backend/.env."
    default: "ADMIN"

  existing_oracle_password:
    type: password
    required: false
    visible: true
    title: "Existing DB password"
    description: "Value written to ORACLE_PASSWORD in backend/.env."
    confirmation: true

  existing_oracle_dsn:
    type: string
    required: false
    visible: true
    title: "Existing DB DSN"
    description: "Optional. Value written to ORACLE_DSN in backend/.env. Leave blank to use <selected ADB db_name>_high, for example NL2SQLADB -> nl2sqladb_high."

  existing_oracle_wallet_password:
    type: password
    required: false
    visible: true
    title: "Existing DB wallet password"
    description: "Value written to ORACLE_WALLET_PASSWORD and used to generate the wallet. Leave blank to reuse the existing DB password."
    confirmation: true

  adb_display_name:
    type: string
    required: false
    visible: true
    title: "ADB display name"
    description: "Leave blank to use the database name."

  adb_name:
    type: string
    required: true
    visible: true
    title: "Database name"
    description: "ADB database name. Default is NL2SQLADB."
    default: "NL2SQLADB"
    pattern: "^[A-Za-z][A-Za-z0-9]{0,13}$"

  adb_workload:
    type: enum
    required: true
    visible: true
    title: "Workload type"
    enum:
      - "OLTP"
      - "DW"
      - "AJD"
      - "APEX"
      - "LH"
    default: "OLTP"

  adb_db_version:
    type: enum
    required: true
    visible: true
    title: "Database version"
    enum:
      - "19c"
      - "23ai"
      - "26ai"
    default: "26ai"

  adb_compute_model:
    type: enum
    required: true
    visible: false
    title: "Compute model"
    enum:
      - "ECPU"
      - "OCPU"
    default: "ECPU"

  adb_compute_count:
    type: number
    required: true
    visible: true
    title: "ECPU count"
    default: 2

  adb_is_auto_scaling_enabled:
    type: boolean
    required: true
    visible: true
    title: "CPU auto scaling"
    default: false

  adb_data_storage_size_in_tbs:
    type: number
    required: true
    visible: true
    title: "Storage (TB)"
    default: 1

  adb_is_auto_scaling_for_storage_enabled:
    type: boolean
    required: true
    visible: true
    title: "Storage auto scaling"
    default: false

  adb_is_elastic_pool_enabled:
    type: boolean
    required: true
    visible: true
    title: "Enable elastic pool"
    default: false

  adb_resource_pool_size:
    type: number
    required: true
    visible:
      eq:
        - adb_is_elastic_pool_enabled
        - true
    title: "Elastic pool size"
    default: 0

  adb_resource_pool_storage_size_in_tbs:
    type: number
    required: true
    visible:
      eq:
        - adb_is_elastic_pool_enabled
        - true
    title: "Elastic pool storage (TB)"
    default: 0

  license_model:
    type: enum
    required: true
    visible: true
    title: "License type"
    enum:
      - "BRING_YOUR_OWN_LICENSE"
      - "LICENSE_INCLUDED"
    default: "LICENSE_INCLUDED"

  adb_backup_retention_period_in_days:
    type: number
    required: true
    visible: true
    title: "Automatic backup retention period (days)"
    default: 1

  adb_password:
    type: password
    required: false
    visible: true
    title: "Database ADMIN password"
    description: "Used for the ADB ADMIN user, wallet password, and Oracle connection password."
    confirmation: true
    pattern: '^$|^[^"\r\n]{12,30}$'

  adb_network_access_type:
    type: enum
    required: true
    visible: true
    title: "ADB network access"
    description: "Default secure mode enables the ADB access-control list. With VCN notation and no override, the stack allows the selected Compute subnet."
    enum:
      - "PUBLIC_ENDPOINT"
      - "SECURE_ACCESS_FROM_ALLOWED_IPS_AND_VCNS"
      - "PRIVATE_ENDPOINT_ONLY"
    default: "SECURE_ACCESS_FROM_ALLOWED_IPS_AND_VCNS"

  adb_use_private_subnet:
    type: boolean
    required: true
    visible: false
    title: "Use private subnet for ADB"
    default: false

  adb_subnet_id:
    type: oci:core:subnet:id
    required: false
    visible:
      eq:
        - adb_network_access_type
        - "PRIVATE_ENDPOINT_ONLY"
    title: "ADB private endpoint subnet"
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${vcn_ai_vcn_id}

  adb_acl_notation_type:
    type: enum
    required: true
    visible:
      eq:
        - adb_network_access_type
        - "SECURE_ACCESS_FROM_ALLOWED_IPS_AND_VCNS"
    title: "ADB ACL notation type"
    enum:
      - "VCN"
      - "CIDR_BLOCK"
    default: "VCN"

  adb_acl_vcn_id:
    type: oci:core:vcn:id
    required: false
    visible:
      eq:
        - adb_network_access_type
        - "SECURE_ACCESS_FROM_ALLOWED_IPS_AND_VCNS"
    title: "Allowed VCN"
    description: "Optional override. Leave blank to reuse the deployment VCN selected above."
    dependsOn:
      compartmentId: ${compartment_ocid}

  adb_acl_subnet_id:
    type: oci:core:subnet:id
    required: false
    visible:
      eq:
        - adb_network_access_type
        - "SECURE_ACCESS_FROM_ALLOWED_IPS_AND_VCNS"
    title: "Allowed subnet"
    description: "Optional override. Leave blank to reuse the Compute subnet. The subnet CIDR is added as VCN;CIDR in the ADB access list."
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${adb_acl_vcn_id}

  adb_acl_cidr_blocks:
    type: string
    required: false
    visible:
      eq:
        - adb_acl_notation_type
        - "CIDR_BLOCK"
    title: "Allowed CIDR blocks"
    description: "Comma-separated CIDR blocks for ADB secure access."

  adb_is_mtls_connection_required:
    type: boolean
    required: true
    visible: true
    title: "Require mutual TLS (mTLS)"
    description: "Enabled by default. Thin mode uses the generated Wallet for mTLS; set false only for walletless one-way TLS ADBs."
    default: true

  instance_display_name:
    type: string
    required: true
    visible: true
    title: "Compute instance name"
    default: "NL2SQL_INSTANCE"

  instance_image_source_id:
    type: enum
    required: true
    visible: true
    title: "Compute image"
    description: "Choose the Ubuntu image according to your region."
    enum:
      - "ocid1.image.oc1.ap-tokyo-1.aaaaaaaaoiusqhftxmiyjlulnxx5mdnqfv6pjx4hdcoks3exn7gsrcwpkpdq"
      - "ocid1.image.oc1.ap-osaka-1.aaaaaaaa7sbmd5q54w466eojxqwqfvvp554awzjpt2behuwsiefrxnwomq5a"
      - "ocid1.image.oc1.us-chicago-1.aaaaaaaal25tbfrlwhh27tzgiatqr3oq5y3qzz7wgpezjouvjk2cdfdr4mnq"
    default: "ocid1.image.oc1.ap-osaka-1.aaaaaaaa7sbmd5q54w466eojxqwqfvvp554awzjpt2behuwsiefrxnwomq5a"

  instance_shape:
    type: enum
    required: true
    visible: true
    title: "Compute shape"
    enum:
      - "VM.Standard.E4.Flex"
      - "VM.Standard.E5.Flex"
    default: "VM.Standard.E5.Flex"

  instance_flex_shape_ocpus:
    type: number
    required: true
    visible: true
    title: "Compute OCPUs"
    default: 2

  instance_flex_shape_memory:
    type: number
    required: true
    visible: true
    title: "Compute memory (GB)"
    default: 16

  instance_boot_volume_size:
    type: number
    required: true
    visible: true
    title: "Boot volume size (GB)"
    default: 100

  instance_boot_volume_vpus:
    type: number
    required: true
    visible: true
    title: "Boot volume VPUs/GB"
    default: 10

  subnet_ai_subnet_id:
    type: oci:core:subnet:id
    required: true
    visible: true
    title: "Compute subnet"
    description: "Select a public or private subnet. Public IP assignment is detected automatically from the selected subnet."
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${vcn_ai_vcn_id}

  ssh_authorized_keys:
    type: oci:core:ssh:publickey
    required: true
    visible: true
    title: "SSH public key"
    description: "Upload a public key for the ubuntu user."

outputs:
  autonomous_database_ocid:
    title: "Autonomous AI Database OCID"
    displayText: "Autonomous AI Database OCID"
    type: copyableString
    visible: true

  autonomous_database_high_connection_string:
    title: "Autonomous AI Database HIGH connection string"
    displayText: "Autonomous AI Database HIGH connection string"
    type: copyableString
    visible: true

  ssh_to_instance:
    title: "SSH command"
    displayText: "SSH command"
    type: copyableString
    visible: true

  application_url:
    title: "Application URL"
    displayText: "Application URL"
    type: copyableString
    visible: true
