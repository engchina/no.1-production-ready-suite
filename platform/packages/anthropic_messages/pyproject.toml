[project]
name = "production-ready-anthropic-messages"
version = "0.1.0"
description = "Thin shared caller of the Anthropic Claude Messages API (official anthropic SDK) that returns the same result shape and failure classification as the OCI Enterprise AI layers of the No.1 Production Ready products."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# 公式の Python SDK で Messages API を呼ぶ（OpenAI 互換の shim は使わない）。失敗の分類は
# pr_enterprise_ai（標準 library だけ）の種類と error code に写す。
dependencies = [
  "anthropic>=2.8,<3",
  "production-ready-enterprise-ai",
]

[tool.uv.sources]
production-ready-enterprise-ai = { path = "../enterprise_ai", editable = true }

[dependency-groups]
dev = [
  # テストで SDK の HTTP を録画の応答に置き換える（anthropic 2.x の HTTP の client は httpx2）。
  "httpx2>=2.0,<3",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-xdist>=3.8",
  "pytest-timeout>=2.3",
  "ruff>=0.9",
  "mypy>=1.14",
  "bandit>=1.8",
  "pip-audit>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_anthropic_messages"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# 整形（#345）。black と同じ既定にそろえる。
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
# 1 つのテストが止まったら 120 秒で失敗にする（pytest-timeout。#1591）。
timeout = 120
