[project]
name = "production-ready-system-settings-backend"
version = "0.1.0"
description = "Shared system settings APIs (upload storage, OCI, model, database) for the No.1 Production Ready product family (RAG / NL2SQL / Agent)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.121,<1.0",
  "pydantic>=2.11",
  "python-multipart>=0.0.20",
  "cryptography>=50.0.0",
  "python-dotenv>=1.0",
  "production-ready-backend-core",
]

[project.optional-dependencies]
# OCI SDK は接続テスト / namespace 取得 / 設定読込で遅延 import する（3製品は既に依存している）。
oci = ["oci>=2.168"]

[tool.uv.sources]
production-ready-backend-core = { path = "../backend_core", editable = true }

[dependency-groups]
dev = [
  "oci>=2.168",
  "httpx==0.28.1",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "black>=25.1",
  "mypy>=1.14",
  "bandit>=1.8",
  "pip-audit>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_system_settings"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
