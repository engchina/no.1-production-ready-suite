# HTTP context。query・body・IP・認証情報・具体的な resource ID は記録しない。
map $http_x_request_id $pr_request_id {
    default $request_id;
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
}
map $uri $pr_route {
    default "/static/*";
    ~^/api/services/[^/]+/status$ "/api/services/{service_id}/status";
    /api/mcp "/api/mcp";
    /api/health "/api/health";
    /api/ready "/api/ready";
    ~^/api/ "/api/*";
}
map "$request_method:$pr_route:$status" $pr_loggable {
    default 1;
    ~^GET:/api/services/\{service_id\}/status:2[0-9][0-9]$ 0;
}
log_format production_ready_json escape=json
    '{"schema_version":1,"timestamp_epoch":$msec,"level":"INFO",'
    '"name":"nginx.access","event":"http_access","message":"HTTP リクエスト",'
    '"component":"nginx","service_name":"$pr_service_name",'
    '"request_id":"$pr_request_id","http_method":"$request_method",'
    '"http_route":"$pr_route","http_status":$status,"duration_seconds":$request_time}';
