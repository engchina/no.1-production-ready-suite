[project]
name = "docrag-core"
version = "0.2.0"
description = "rag_poc(DocRAG) 由来の解析・Small-to-Big 分割・根拠付き回答・FAQ/ドメインキーワード実装(Gradio 非依存)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.99,<2",
]

[project.optional-dependencies]
# docling サービスだけが使う(backend には入れない)。
docling = ["docling>=2.0", "pypdfium2>=5.0,<6.0", "pillow>=10.0"]
pdf = ["pypdfium2>=5.0,<6.0", "pillow>=10.0"]
japanese = ["PyStemmer==3.1.0", "sudachidict_full==20260723", "sudachipy==0.6.11"]
excel = ["openpyxl>=3.1", "xlrd>=2.0", "pandas>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docrag"]

[tool.ruff]
line-length = 140
target-version = "py312"
