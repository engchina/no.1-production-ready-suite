#cloud-config
output: {all: '| tee -a /var/log/cloud-init-custom.log'}
bootcmd:
  - mkdir -p /u01/aipoc/props ${wallet_dir_host}
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - dos2unix
  - git
  - netfilter-persistent
  - openssl
  - unzip
write_files:
%{ for product, env in backend_envs ~}
  - path: "/u01/aipoc/props/${product}.backend.env"
    permissions: "0600"
    owner: "root:root"
    encoding: "gzip+base64"
    content: |
      ${env}
%{ endfor ~}
  - path: "/u01/aipoc/props/platform.env"
    permissions: "0600"
    owner: "root:root"
    encoding: "gzip+base64"
    content: |
      ${platform_env}
  - path: "/u01/aipoc/props/wallet.zip"
    permissions: "0600"
    owner: "root:root"
    encoding: "base64"
    content: |
      ${wallet_content}
  - path: "/u01/aipoc/props/products.txt"
    permissions: "0644"
    content: |
      ${products}
  - path: "/u01/aipoc/props/https_enabled.txt"
    permissions: "0644"
    content: |
      ${https_enabled}
  - path: "/u01/aipoc/props/http_port.txt"
    permissions: "0644"
    content: |
      ${http_port}
  - path: "/u01/aipoc/props/https_port.txt"
    permissions: "0644"
    content: |
      ${https_port}
  - path: "/u01/aipoc/props/assign_public_ip.txt"
    permissions: "0644"
    content: |
      ${assign_public_ip}
%{ if rag_services != "" ~}
  - path: "/u01/aipoc/props/rag_services.txt"
    permissions: "0644"
    content: |
      ${rag_services}
%{ endif ~}
  - path: "/u01/aipoc/props/adb_name.txt"
    permissions: "0644"
    content: |
      ${adb_name}
  - path: "/u01/aipoc/props/adb_dsn.txt"
    permissions: "0644"
    content: |
      ${db_dsn}
  - path: "/u01/aipoc/props/adb_ocid.txt"
    permissions: "0644"
    content: |
      ${adb_ocid}
  - path: "/u01/aipoc/props/compartment_ocid.txt"
    permissions: "0644"
    content: |
      ${compartment_ocid}
  - path: "/u01/aipoc/props/region.txt"
    permissions: "0644"
    content: |
      ${region}
  - path: "/u01/aipoc/bootstrap-suite.sh"
    permissions: "0755"
    owner: "root:root"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      export DEBIAN_FRONTEND=noninteractive

      APP_ROOT="/u01/aipoc"
      # 3 製品（rag/ nl2sql/ agent/）と共有 platform（platform/）は同じ monorepo にあるため、clone は1回だけ行う。
      SUITE_REPO_DIR="$${APP_ROOT}/no.1-production-ready-suite"

      log() {
        printf '[suite-bootstrap] %s\n' "$*"
      }

      trap 'status=$?; log "Bootstrap failed at line $${LINENO} with status $${status}: $${BASH_COMMAND}"; exit "$${status}"' ERR

      run_with_retries() {
        local attempts="$1"
        shift
        local attempt status
        status=0
        for attempt in $(seq 1 "$${attempts}"); do
          if "$@"; then
            return 0
          fi
          status="$?"
          log "Command failed with status $${status} on attempt $${attempt}/$${attempts}: $*"
          sleep $((attempt * 5))
        done
        return "$${status}"
      }

      clone_or_update_repo() {
        local url="$1"
        local ref="$2"
        local dest="$3"
        if [ -d "$${dest}/.git" ]; then
          log "Updating $${dest} to $${ref}."
          run_with_retries 5 git -C "$${dest}" fetch --depth 1 origin "$${ref}"
          git -C "$${dest}" checkout -f FETCH_HEAD
        else
          log "Cloning $${url} ($${ref}) to $${dest}."
          run_with_retries 5 git clone --branch "$${ref}" --depth 1 --single-branch "$${url}" "$${dest}"
        fi
      }

      # 選んだ製品を 1 台に配備する（#1316）。各製品の init_script.sh は suite-init.sh が順に呼び、
      # Nginx の site（/rag/ /nl2sql/ /agent/、HTTPS）と firewall（80 / 443）は suite-init.sh が 1 つだけ書く。
      run_suite_init() {
        local init_script="$${SUITE_REPO_DIR}/platform/deploy/suite-init.sh"
        if [ ! -f "$${init_script}" ]; then
          log "Missing suite init script: $${init_script}"
          return 1
        fi
        dos2unix "$${init_script}" || true
        log "Starting Compute initialization via $${init_script}."
        APP_ROOT="$${APP_ROOT}" bash "$${init_script}"
      }

      clone_or_update_repo "${application_git_url}" "${application_git_ref}" "$${SUITE_REPO_DIR}"
      run_suite_init
      log "Deployment finished. See /var/log/suite-init.log."
runcmd:
  - "nohup bash /u01/aipoc/bootstrap-suite.sh >> /var/log/cloud-init-custom.log 2>&1 &"
