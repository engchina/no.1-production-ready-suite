title: "Deploy Production Ready Suite on Oracle Cloud Infrastructure"
stackDescription: "Deploy the selected Production Ready products (RAG / NL2SQL / Agent Control Plane) on OCI. One Oracle Autonomous AI Database 26ai (new or existing) is shared by every product, and each selected product gets its own Compute instance. Configure AI runtime settings after startup from each application's System Settings."
schemaVersion: 1.1.0
version: "20260926.1"
locale: "en"

variableGroups:
  - title: Hidden
    visible: false
    variables:
      - adb_compute_model
      - application_git_url
      - application_git_ref
      - existing_oracle_wallet_password
      - adb_is_mtls_connection_required
      - nl2sql_app_environment
      - nl2sql_app_auth_cookie_secure
      - nl2sql_app_admin_login_user_id
      - agent_runtime_repository_backend

  - title: Required Configuration
    visible: true
    variables:
      - region
      - compartment_ocid
      - availability_domain
      - vcn_ai_vcn_id

  - title: "配備する製品"
    visible: true
    variables:
      - deploy_rag
      - deploy_nl2sql
      - deploy_agent

  - title: Application Source
    visible: true
    variables:
      - application_port

  - title: Autonomous AI Database
    visible: true
    variables:
      - adb_compartment_ocid
      - adb_deployment_mode

  - title: Existing Autonomous AI Database
    visible:
      eq:
        - adb_deployment_mode
        - "既存の Autonomous AI Database を選択"
    variables:
      - existing_adb_ocid
      - existing_oracle_user
      - existing_oracle_password
      - existing_oracle_dsn

  - title: New Autonomous AI Database
    visible:
      eq:
        - adb_deployment_mode
        - "新規 Autonomous AI Database の作成"
    variables:
      - adb_display_name
      - adb_name
      - adb_workload
      - adb_db_version
      - adb_compute_count
      - adb_is_auto_scaling_enabled
      - adb_data_storage_size_in_tbs
      - adb_is_auto_scaling_for_storage_enabled
      - adb_is_elastic_pool_enabled
      - adb_resource_pool_size
      - adb_resource_pool_storage_size_in_tbs
      - license_model
      - adb_backup_retention_period_in_days
      - adb_password

  - title: "ネットワーク・アクセス"
    visible:
      eq:
        - adb_deployment_mode
        - "新規 Autonomous AI Database の作成"
    variables:
      - adb_network_access_type
      - adb_private_endpoint_vcn_compartment_id
      - adb_private_endpoint_vcn_id
      - adb_private_endpoint_subnet_compartment_id
      - adb_subnet_id
      - adb_acl_notation_type
      - adb_acl_vcn_compartment_id
      - adb_acl_vcn_id
      - adb_acl_subnet_compartment_id
      - adb_acl_subnet_id
      - adb_acl_cidr_blocks

  - title: RAG
    visible: deploy_rag
    variables:
      - rag_app_login_user
      - rag_app_login_password
      - rag_app_auth_cookie_secure
      - rag_enable_parser_docling
      - rag_enable_parser_marker
      - rag_enable_oci_cloud_parsers
      - rag_instance_display_name
      - rag_instance_flex_shape_ocpus
      - rag_instance_flex_shape_memory
      - rag_instance_boot_volume_size

  - title: NL2SQL
    visible: deploy_nl2sql
    variables:
      - nl2sql_app_admin_login_user_password
      - nl2sql_instance_display_name
      - nl2sql_instance_flex_shape_ocpus
      - nl2sql_instance_flex_shape_memory
      - nl2sql_instance_boot_volume_size

  - title: "NL2SQL Deep Data Security"
    visible: deploy_nl2sql
    variables:
      - nl2sql_oracle_deepsec_enabled
      - nl2sql_oracle_deepsec_data_user_password

  - title: Agent Control Plane
    visible: deploy_agent
    variables:
      - agent_app_basic_auth_user
      - agent_app_basic_auth_password
      - agent_control_plane_public_base_url
      - agent_control_plane_mcp_token_secret
      - agent_instance_display_name
      - agent_instance_flex_shape_ocpus
      - agent_instance_flex_shape_memory
      - agent_instance_boot_volume_size

  - title: Compute
    visible: true
    variables:
      - instance_image_source_id
      - instance_shape
      - instance_boot_volume_vpus
      - subnet_ai_subnet_id
      - ssh_authorized_keys

variables:
  region:
    title: Region
    type: oci:identity:region:name
    required: true
    visible: false
    default: "ap-osaka-1"

  compartment_ocid:
    type: oci:identity:compartment:id
    required: true
    visible: true
    title: "Create in compartment"

  availability_domain:
    type: oci:identity:availabilitydomain:name
    required: true
    visible: true
    title: "Availability domain"
    dependsOn:
      region: ${region}
      compartmentId: ${compartment_ocid}

  vcn_ai_vcn_id:
    type: oci:core:vcn:id
    required: true
    visible: true
    title: "VCN"
    description: "Select an existing virtual cloud network."
    dependsOn:
      compartmentId: ${compartment_ocid}

  application_git_url:
    type: string
    required: true
    visible: false
    title: "Application Git URL"
    description: "Production Ready suite monorepo (rag/, nl2sql/, agent/, and platform/)."
    default: "https://github.com/engchina/no.1-production-ready-suite.git"

  application_git_ref:
    type: string
    required: true
    visible: false
    title: "Application Git ref"
    description: "Branch or tag to clone. The default deploys main."
    default: "main"


  application_port:
    type: number
    required: true
    visible: true
    title: "Application port"
    description: "TCP port exposed by host Nginx and the instance firewall of every Compute instance."
    default: 80

  adb_compartment_ocid:
    type: oci:identity:compartment:id
    required: true
    visible: true
    title: "ADBのコンパートメント"
    description: "新規Autonomous AI Databaseの作成先、または既存Autonomous AI Databaseの候補を絞り込むコンパートメントを選択します。Computeのデプロイ先には影響しません。"
    default: compartment_ocid

  adb_deployment_mode:
    type: enum
    required: true
    visible: true
    title: "ADBの利用方法"
    description: "新規Autonomous AI Databaseを作成するか、選択したコンパートメント内の既存Autonomous AI Databaseを使用するかを選択します。"
    enum:
      - "新規 Autonomous AI Database の作成"
      - "既存の Autonomous AI Database を選択"
    default: "新規 Autonomous AI Database の作成"

  existing_adb_ocid:
    type: oci:database:autonomousdatabase:id
    required: false
    visible: true
    title: "既存のAutonomous AI Database"
    description: "選択したコンパートメント内の既存ADBを選択します。TerraformがWalletを生成し、接続設定をbackend/.envへ反映します。"
    dependsOn:
      compartmentId: ${adb_compartment_ocid}

  existing_oracle_user:
    type: string
    required: false
    visible: true
    title: "Existing DB username"
    description: "Value written to ORACLE_USER in backend/.env of every product. Single quotes are not allowed."
    default: "ADMIN"

  existing_oracle_password:
    type: password
    required: false
    visible: true
    title: "Existing DB password"
    description: "Value written to ORACLE_PASSWORD in backend/.env of every product. Single quotes are not allowed."
    confirmation: true

  existing_oracle_dsn:
    type: string
    required: false
    visible: true
    title: "Existing DB DSN"
    description: "Optional. Value written to ORACLE_DSN in backend/.env. Leave blank to use <selected ADB db_name>_high, for example SUITEADB -> suiteadb_high."

  existing_oracle_wallet_password:
    type: password
    required: false
    visible: false
    title: "Existing DB wallet password"
    description: "Hidden compatibility input. Existing ADB wallet generation reuses the existing DB password."
    confirmation: true

  adb_display_name:
    type: string
    required: false
    visible: true
    title: "ADB display name"
    description: "Leave blank to use the database name."

  adb_name:
    type: string
    required: true
    visible: true
    title: "Database name"
    description: "ADB database name. Default is SUITEADB. Every deployed product uses this database."
    default: "SUITEADB"
    pattern: "^[A-Za-z][A-Za-z0-9]{0,13}$"

  adb_workload:
    type: enum
    required: true
    visible: true
    title: "Workload type"
    enum:
      - "OLTP"
      - "AJD"
      - "APEX"
      - "LH"
    default: "OLTP"

  adb_db_version:
    type: enum
    required: true
    visible: true
    title: "Database version"
    enum:
      - "19c"
      - "23ai"
      - "26ai"
    default: "26ai"

  adb_compute_model:
    type: enum
    required: true
    visible: false
    title: "Compute model"
    enum:
      - "ECPU"
      - "OCPU"
    default: "ECPU"

  adb_compute_count:
    type: number
    required: true
    visible: true
    title: "ECPU count"
    default: 2

  adb_is_auto_scaling_enabled:
    type: boolean
    required: true
    visible: true
    title: "CPU auto scaling"
    default: false

  adb_data_storage_size_in_tbs:
    type: number
    required: true
    visible: true
    title: "Storage (TB)"
    default: 1

  adb_is_auto_scaling_for_storage_enabled:
    type: boolean
    required: true
    visible: true
    title: "Storage auto scaling"
    default: false

  adb_is_elastic_pool_enabled:
    type: boolean
    required: true
    visible: true
    title: "Enable elastic pool"
    default: false

  adb_resource_pool_size:
    type: number
    required: true
    visible:
      eq:
        - adb_is_elastic_pool_enabled
        - true
    title: "Elastic pool size"
    default: 0

  adb_resource_pool_storage_size_in_tbs:
    type: number
    required: true
    visible:
      eq:
        - adb_is_elastic_pool_enabled
        - true
    title: "Elastic pool storage (TB)"
    default: 0

  license_model:
    type: enum
    required: true
    visible: true
    title: "License type"
    enum:
      - "BRING_YOUR_OWN_LICENSE"
      - "LICENSE_INCLUDED"
    default: "LICENSE_INCLUDED"

  adb_backup_retention_period_in_days:
    type: number
    required: true
    visible: true
    title: "Automatic backup retention period (days)"
    default: 1

  adb_password:
    type: password
    required: false
    visible: true
    title: "Database ADMIN password"
    description: "Used for the ADB ADMIN user, wallet password, and Oracle connection password of every product. Single quotes are not allowed."
    confirmation: true
    pattern: '^$|^[^"''\r\n]{12,30}$'

  adb_network_access_type:
    type: enum
    required: true
    visible: true
    title: "アクセス・タイプ"
    description: "Autonomous AI Databaseのネットワーク・アクセスを選択します。すべての場所からのセキュア・アクセスはパブリック・エンドポイントを使用し、許可されたIPおよびVCN限定のセキュア・アクセスはACLで接続元を制限し、プライベート・エンドポイント・アクセスのみは指定したVCN内のプライベート・エンドポイントを使用します。"
    enum:
      - "すべての場所からのセキュア・アクセス"
      - "許可されたIPおよびVCN限定のセキュア・アクセス"
      - "プライベート・エンドポイント・アクセスのみ"
    default: "プライベート・エンドポイント・アクセスのみ"

  adb_private_endpoint_vcn_compartment_id:
    type: oci:identity:compartment:id
    required: true
    visible:
      eq:
        - adb_network_access_type
        - "プライベート・エンドポイント・アクセスのみ"
    title: "VCNのコンパートメント"
    description: "プライベート・エンドポイントで使用するVCNが存在するコンパートメントを選択します。"
    default: compartment_ocid

  adb_private_endpoint_vcn_id:
    type: oci:core:vcn:id
    required: true
    visible:
      eq:
        - adb_network_access_type
        - "プライベート・エンドポイント・アクセスのみ"
    title: "仮想クラウド・ネットワーク"
    description: "Autonomous AI Databaseのプライベート・エンドポイントで使用するVCNを選択します。"
    dependsOn:
      compartmentId: ${adb_private_endpoint_vcn_compartment_id}

  adb_private_endpoint_subnet_compartment_id:
    type: oci:identity:compartment:id
    required: true
    visible:
      eq:
        - adb_network_access_type
        - "プライベート・エンドポイント・アクセスのみ"
    title: "サブネットのコンパートメント"
    description: "Autonomous AI Databaseをアタッチするサブネットが存在するコンパートメントを選択します。"
    default: compartment_ocid

  adb_subnet_id:
    type: oci:core:subnet:id
    required: true
    visible:
      eq:
        - adb_network_access_type
        - "プライベート・エンドポイント・アクセスのみ"
    title: "サブネット"
    description: "Autonomous AI Databaseのプライベート・エンドポイントをアタッチするサブネットを選択します。"
    dependsOn:
      compartmentId: ${adb_private_endpoint_subnet_compartment_id}
      vcnId: ${adb_private_endpoint_vcn_id}

  adb_acl_notation_type:
    type: enum
    required: true
    visible:
      eq:
        - adb_network_access_type
        - "許可されたIPおよびVCN限定のセキュア・アクセス"
    title: "IP表記法タイプ"
    description: "ACLで許可する接続元を、VCNまたはIPアドレス/CIDRブロックから選択します。"
    enum:
      - "VCN"
      - "IPアドレスまたはCIDRブロック"
    default: "VCN"

  adb_acl_vcn_compartment_id:
    type: oci:identity:compartment:id
    required: true
    visible:
      and:
        - eq:
            - adb_network_access_type
            - "許可されたIPおよびVCN限定のセキュア・アクセス"
        - eq:
            - adb_acl_notation_type
            - "VCN"
    title: "VCNのコンパートメント"
    description: "アクセスを許可するVCNのコンパートメントを選択します。"
    default: compartment_ocid

  adb_acl_vcn_id:
    type: oci:core:vcn:id
    required: true
    visible:
      and:
        - eq:
            - adb_network_access_type
            - "許可されたIPおよびVCN限定のセキュア・アクセス"
        - eq:
            - adb_acl_notation_type
            - "VCN"
    title: "許可する仮想クラウド・ネットワーク"
    description: "Service Gateway経由でAutonomous AI Databaseへのアクセスを許可するVCNを選択します。"
    dependsOn:
      compartmentId: ${adb_acl_vcn_compartment_id}

  adb_acl_subnet_compartment_id:
    type: oci:identity:compartment:id
    required: false
    visible:
      and:
        - eq:
            - adb_network_access_type
            - "許可されたIPおよびVCN限定のセキュア・アクセス"
        - eq:
            - adb_acl_notation_type
            - "VCN"
    title: "サブネットのコンパートメント"
    description: "アクセスを許可するサブネットのコンパートメントを選択します。サブネットを指定しない場合は選択したVCN全体を許可します。"
    default: compartment_ocid

  adb_acl_subnet_id:
    type: oci:core:subnet:id
    required: false
    visible:
      and:
        - eq:
            - adb_network_access_type
            - "許可されたIPおよびVCN限定のセキュア・アクセス"
        - eq:
            - adb_acl_notation_type
            - "VCN"
    title: "許可するサブネット（オプション）"
    description: "選択したサブネットのCIDRをVCNアクセス制御ルールへ追加します。未選択の場合はVCN全体を許可します。"
    dependsOn:
      compartmentId: ${adb_acl_subnet_compartment_id}
      vcnId: ${adb_acl_vcn_id}

  adb_acl_cidr_blocks:
    type: string
    required: false
    visible:
      and:
        - eq:
            - adb_network_access_type
            - "許可されたIPおよびVCN限定のセキュア・アクセス"
        - eq:
            - adb_acl_notation_type
            - "IPアドレスまたはCIDRブロック"
    title: "許可するIPアドレスまたはCIDRブロック"
    description: "パブリック・インターネットからの接続を許可するクライアントのパブリックIPアドレスまたはパブリックCIDRブロックをカンマ区切りで入力します。"

  adb_is_mtls_connection_required:
    type: boolean
    required: true
    visible: false
    title: "相互TLS (mTLS)認証が必要"
    description: "既定では有効です。Thinモードは生成したWalletでmTLS接続します。Walletを使用しない一方向TLSのADBだけ無効にしてください。"
    default: true

  instance_image_source_id:
    type: enum
    required: true
    visible: true
    title: "Compute image"
    description: "Ubuntu image of every Compute instance. Choose it according to your region."
    enum:
      - "ocid1.image.oc1.ap-tokyo-1.aaaaaaaaoiusqhftxmiyjlulnxx5mdnqfv6pjx4hdcoks3exn7gsrcwpkpdq"
      - "ocid1.image.oc1.ap-osaka-1.aaaaaaaa7sbmd5q54w466eojxqwqfvvp554awzjpt2behuwsiefrxnwomq5a"
    default: "ocid1.image.oc1.ap-osaka-1.aaaaaaaa7sbmd5q54w466eojxqwqfvvp554awzjpt2behuwsiefrxnwomq5a"

  instance_shape:
    type: enum
    required: true
    visible: true
    title: "Compute shape"
    description: "Shape of every Compute instance. OCPUs, memory, and boot volume size are set per product."
    enum:
      - "VM.Standard.E4.Flex"
      - "VM.Standard.E5.Flex"
    default: "VM.Standard.E5.Flex"

  instance_boot_volume_vpus:
    type: number
    required: true
    visible: true
    title: "Boot volume VPUs/GB"
    default: 10

  subnet_ai_subnet_id:
    type: oci:core:subnet:id
    required: true
    visible: true
    title: "Compute subnet"
    description: "Subnet of every Compute instance. Select a public or private subnet; public IP assignment is detected automatically. Put the ADB network access rules in line with this subnet."
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${vcn_ai_vcn_id}

  ssh_authorized_keys:
    type: oci:core:ssh:publickey
    required: true
    visible: true
    title: "SSHキーの追加"
    description: "SSHキーペアを自動生成するか、既存の公開キーをアップロードまたは貼り付けて、ubuntuユーザーのSSH接続に使用します。"

  deploy_rag:
    type: boolean
    required: true
    visible: true
    title: "RAG"
    description: "Production Ready RAG（ナレッジ構築・業務ビュー・検索・回答）を専用の Compute に配備します。少なくとも1つの製品を選択してください。"
    default: true

  deploy_nl2sql:
    type: boolean
    required: true
    visible: true
    title: "NL2SQL"
    description: "Production Ready NL2SQL（SQL 専用の自然言語問い合わせ）を専用の Compute に配備します。"
    default: true

  deploy_agent:
    type: boolean
    required: true
    visible: true
    title: "Agent Control Plane"
    description: "Production Control Plane for AI Agents を専用の Compute に配備します。"
    default: true

  rag_app_login_user:
    type: string
    required: true
    visible: deploy_rag
    title: "RAG login user"
    description: "Written to AUTH_USERNAME. The RAG backend requires a Cookie session login (AUTH_MODE=production) for the UI and API."
    default: "rag_admin"
    pattern: "^[A-Za-z][A-Za-z0-9_.-]{2,31}$"

  rag_app_login_password:
    type: password
    required: false
    visible: deploy_rag
    title: "RAG login password"
    description: "Required when RAG is deployed. Written to AUTH_PASSWORD. 12-64 characters with uppercase, lowercase, and digits. Quotes, backslashes, and line breaks are not allowed."
    confirmation: true
    pattern: '^$|^[^"''\\\r\n]{12,64}$'

  rag_app_auth_cookie_secure:
    type: boolean
    required: true
    visible: deploy_rag
    title: "RAG secure session cookie (HTTPS only)"
    description: "Written to AUTH_COOKIE_SECURE. Keep disabled while the application is served over plain HTTP; enable it after you put HTTPS (for example, an OCI Load Balancer) in front."
    default: false

  rag_enable_parser_docling:
    type: boolean
    required: true
    visible: deploy_rag
    title: "Docling parser (CPU)"
    description: "Build and start parser-docling. The Unstructured parser (parser-unstructured) is always started because it is the default document parser."
    default: true

  rag_enable_parser_marker:
    type: boolean
    required: true
    visible: deploy_rag
    title: "Marker parser (CPU)"
    description: "Build and start parser-marker. It needs more CPU and memory than the other CPU parsers."
    default: false

  rag_enable_oci_cloud_parsers:
    type: boolean
    required: true
    visible: deploy_rag
    title: "OCI cloud parsers"
    description: "Build and start parser-oci-genai-vision and parser-oci-document-understanding. They call OCI services and need no GPU. GPU parsers (MinerU / Dots.OCR) are not part of this stack; set their external API hosts in the document parsing settings."
    default: false

  rag_instance_display_name:
    type: string
    required: true
    visible: deploy_rag
    title: "RAG Compute instance name"
    default: "RAG_INSTANCE"

  rag_instance_flex_shape_ocpus:
    type: number
    required: true
    visible: deploy_rag
    title: "RAG Compute OCPUs"
    default: 4

  rag_instance_flex_shape_memory:
    type: number
    required: true
    visible: deploy_rag
    title: "RAG Compute memory (GB)"
    description: "The CPU document parsers (Docling / Marker) load ML models. 32 GB or more is recommended."
    default: 32

  rag_instance_boot_volume_size:
    type: number
    required: true
    visible: deploy_rag
    title: "RAG boot volume size (GB)"
    description: "Docker images of the parsers are large. 200 GB or more is recommended."
    default: 200

  nl2sql_app_environment:
    type: enum
    required: true
    visible: false
    title: "NL2SQL application environment"
    description: "Use local for direct HTTP access. Use production only behind HTTPS and set Secure cookies."
    enum:
      - "local"
      - "staging"
      - "production"
    default: "local"

  nl2sql_app_auth_cookie_secure:
    type: boolean
    required: true
    visible: false
    title: "NL2SQL secure auth cookies"
    description: "Set true when NL2SQL is served through HTTPS."
    default: false

  nl2sql_app_admin_login_user_id:
    type: enum
    required: true
    visible: false
    title: "NL2SQL administrator login user ID"
    description: "Fixed login user ID for the built-in SYSTEM_ADMIN configuration administrator. It must be exactly system_admin and is independent from the database connection user."
    enum:
      - "system_admin"
    default: "system_admin"

  nl2sql_app_admin_login_user_password:
    type: password
    required: false
    visible: deploy_nl2sql
    title: "NL2SQL administrator password"
    description: "Required when NL2SQL is deployed. Login password for the built-in SYSTEM_ADMIN (login user ID: system_admin). 12-30 characters with uppercase, lowercase, and digits; must not include admin, double quotes, or line breaks."
    confirmation: true
    pattern: '^$|^[^"\r\n]{12,30}$'

  nl2sql_instance_display_name:
    type: string
    required: true
    visible: deploy_nl2sql
    title: "NL2SQL Compute instance name"
    default: "NL2SQL_INSTANCE"

  nl2sql_instance_flex_shape_ocpus:
    type: number
    required: true
    visible: deploy_nl2sql
    title: "NL2SQL Compute OCPUs"
    default: 2

  nl2sql_instance_flex_shape_memory:
    type: number
    required: true
    visible: deploy_nl2sql
    title: "NL2SQL Compute memory (GB)"
    default: 16

  nl2sql_instance_boot_volume_size:
    type: number
    required: true
    visible: deploy_nl2sql
    title: "NL2SQL boot volume size (GB)"
    default: 100

  nl2sql_oracle_deepsec_enabled:
    type: boolean
    required: true
    visible: deploy_nl2sql
    title: "ORACLE_DEEPSEC_ENABLED"
    description: "Deep Data Securityを有効にする場合はオンにします。オンの場合のみDeepSec DATA USER passwordが必要です。"
    default: true

  nl2sql_oracle_deepsec_data_user_password:
    type: password
    required: false
    visible:
      and:
        - deploy_nl2sql
        - eq:
            - nl2sql_oracle_deepsec_enabled
            - true
    title: "DeepSec DATA USER password"
    description: "Value written to ORACLE_DEEPSEC_DATA_USER_PASSWORD for the shared DEEPSEC_DATA_USER Deep Data Security data connection."
    confirmation: true
    pattern: '^[^"\r\n]{12,256}$'

  agent_app_basic_auth_user:
    type: string
    required: true
    visible: deploy_agent
    title: "Agent Basic authentication user"
    description: "Nginx requires HTTP Basic authentication for the Agent Control Plane UI and API because the application has no built-in login. /health and the Binding MCP endpoint (/api/mcp/) use their own checks."
    default: "agent_admin"
    pattern: "^[A-Za-z][A-Za-z0-9_.-]{2,31}$"

  agent_app_basic_auth_password:
    type: password
    required: false
    visible: deploy_agent
    title: "Agent Basic authentication password"
    description: "Required when the Agent Control Plane is deployed. 12-64 characters with uppercase, lowercase, and digits. Quotes, colons, and line breaks are not allowed. The instance stores only a SHA-512 crypt hash in the Nginx password file."
    confirmation: true
    pattern: '^$|^[^"'':\r\n]{12,64}$'

  agent_control_plane_public_base_url:
    type: string
    required: false
    visible: deploy_agent
    title: "Control Plane public API base URL"
    description: "Optional. Written to AGENT_CONTROL_PLANE_PUBLIC_BASE_URL and advertised to Runtimes for Binding MCP callbacks. Leave blank to use http://<Compute private IP>[:application port]/api."

  agent_control_plane_mcp_token_secret:
    type: password
    required: false
    visible: deploy_agent
    title: "Binding MCP token master secret"
    description: "Optional. Written to AGENT_CONTROL_PLANE_MCP_TOKEN_SECRET (32 characters or more). Leave blank to keep the Binding MCP endpoint fail-closed (503) until you configure it."
    confirmation: true
    pattern: '^$|^[^"\r\n]{32,}$'

  agent_runtime_repository_backend:
    type: enum
    required: true
    visible: false
    title: "Agent Runtime repository"
    description: "Oracle repository for Agent Runtime state. The application creates its own tables at startup."
    enum:
      - "oracle_checkpoint"
      - "oracle_normalized"
    default: "oracle_checkpoint"

  agent_instance_display_name:
    type: string
    required: true
    visible: deploy_agent
    title: "Agent Compute instance name"
    default: "AGENT_INSTANCE"

  agent_instance_flex_shape_ocpus:
    type: number
    required: true
    visible: deploy_agent
    title: "Agent Compute OCPUs"
    default: 2

  agent_instance_flex_shape_memory:
    type: number
    required: true
    visible: deploy_agent
    title: "Agent Compute memory (GB)"
    default: 16

  agent_instance_boot_volume_size:
    type: number
    required: true
    visible: deploy_agent
    title: "Agent boot volume size (GB)"
    default: 100

